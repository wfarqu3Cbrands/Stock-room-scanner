<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bottles</title>
<meta name="theme-color" content="#E8E0D0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Bottles" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
<style>
:root {
  /* High desert: caliche sand, basalt, juniper, sage, red rock, turquoise */
  --bg: #E8E0D0; --surface: #F4EFE5; --surface-2: #ECE4D5; --sheet-bg: #F4EFE5; --input-bg: #FBF8F2;
  --ink: #2A2621; --muted: #6F6556; --line: #D6CAB4; --line-strong: #BFAF93;
  --accent: #A4472B; --on-accent: #FFF8F0; --accent-text: #93391F; --focus: #2F8A87;
  --chip-on: #3F5641; --on-chip-on: #F4EFE5;
  --tag-bg: #DDE3D2; --tag-ink: #3A4E3B; --tag-finish-bg: #CFE6E2; --tag-finish-ink: #1D5F5C; --tag-barrel-bg: #EBD6B3; --tag-barrel-ink: #6A4718; --tag-base-bg: #E8DCCB; --tag-base-ink: #5B4632;
  --danger: #A8321F; --ok: #3E7D4F; --warn: #B8641A; --count-ink: #A4472B;
  --toast-bg: #2A2621; --toast-ink: #F4EFE5; --toast-btn: rgba(255,255,255,.14);
  --banner-bg: #F1DDB8; --banner-ink: #5C3D12; --banner-line: #E0C38E;
  --r: 12px; --r-lg: 16px; --r-chip: 999px; --r-tag: 999px; --r-sheet: 22px;
  --font: "Figtree", system-ui, sans-serif; --font-display: "Young Serif", Georgia, serif; --font-num: "Figtree", system-ui, sans-serif;
  --name-size: 19px; --name-weight: 400; --title-weight: 400; --toast-bottom: 96px;
  --wall: #8A6A45; --turq: #26716E; --basalt: #2A2621;
  color-scheme: light;
}
/* ===== Shared component styles (each version sets the variables) ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.locked, html.locked body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--focus, var(--accent)); outline-offset: 2px; }
.muted { color: var(--muted); }
.lead { margin: 0 0 14px; font-size: 16px; }
.field-hint { font-size: 13px; color: var(--muted); margin: 8px 0 6px; }
h3.sec { font-family: var(--font-sec, var(--font)); font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 8px; letter-spacing: .01em; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: var(--r); border: 1.5px solid var(--line-strong, var(--line)); background: var(--surface-2); color: var(--ink); font-weight: 650; font-size: 15px; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn.wide { width: 100%; margin-top: 14px; }
.link { background: none; border: 0; padding: 8px 6px; color: var(--accent-text, var(--accent)); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--danger); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface-2); padding: 0; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line-strong, var(--line)); background: var(--surface-2); font-size: 20px; font-weight: 600; line-height: 1; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.actions { display: flex; gap: 10px; margin-top: 18px; }
.actions > .btn { flex: 1; }
.actions.col { flex-direction: column; }
.actions.sticky { position: sticky; bottom: -18px; background: var(--sheet-bg, var(--surface)); padding: 12px 0 calc(22px + env(safe-area-inset-bottom)); margin-top: 18px; margin-bottom: -18px; z-index: 2; box-shadow: 0 -12px 12px -12px var(--sheet-bg, var(--surface)); }
.actions.sticky .btn.wide { margin-top: 0; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.col { flex-direction: column; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--r-chip, 999px); border: 1.5px solid var(--line); background: var(--surface-2); font-size: 14.5px; font-weight: 600; }
.chip small { font-weight: 700; opacity: .7; }
.chip.on { background: var(--chip-on); border-color: var(--chip-on); color: var(--on-chip-on); }
.chip.soft { min-height: 34px; font-weight: 500; }
.chip.place { justify-content: space-between; width: 100%; min-height: 48px; border-radius: var(--r); }
.chip.removable { padding-right: 4px; }
.chip.removable button { border: 0; background: none; width: 30px; height: 30px; font-size: 18px; color: var(--muted); }
.chips.sugg:empty { display: none; }
.chips.sugg { margin: -6px 0 12px; }

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font-size: 12.5px; font-weight: 650; padding: 3px 9px; border-radius: var(--r-tag, 6px); background: var(--tag-bg); color: var(--tag-ink); line-height: 1.35; }
.tag.t-finish { background: var(--tag-finish-bg, var(--tag-bg)); color: var(--tag-finish-ink, var(--tag-ink)); }
.tag.t-finish.none { opacity: .7; font-weight: 500; }
.tag.t-base { background: var(--tag-base-bg, var(--tag-bg)); color: var(--tag-base-ink, var(--tag-ink)); }
.tag.t-barrel { background: var(--tag-barrel-bg, var(--tag-bg)); color: var(--tag-barrel-ink, var(--tag-ink)); }
.tag.t-proof { background: transparent; color: var(--muted); padding-left: 2px; padding-right: 2px; }
.pl-loc { font-weight: 700; }
.pl-spot { color: var(--muted); }
.pl-spot::before { content: " › "; }

/* Bottle card */
.card-list { display: flex; flex-direction: column; gap: 10px; }
.bcard { display: block; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; cursor: pointer; }
.bcard:active { transform: scale(.995); }
.bcard-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.bcard-name { font-family: var(--font-display); font-size: var(--name-size, 18px); font-weight: var(--name-weight, 700); line-height: 1.2; }
.bcard-total b { font-family: var(--font-num); font-size: 24px; font-weight: 700; color: var(--count-ink, var(--accent)); font-variant-numeric: tabular-nums; }
.bcard-places { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.bcard-places li { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.bcard-places b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.bcard-empty { margin-top: 8px; font-size: 13.5px; color: var(--muted); }

/* Sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-wrap.on-top { z-index: 80; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .18s; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; background: var(--sheet-bg, var(--surface)); color: var(--ink); border-radius: var(--r-sheet, 20px) var(--r-sheet, 20px) 0 0; transform: translateY(24px); opacity: 0; transition: transform .2s ease, opacity .2s ease; box-shadow: 0 -10px 40px rgba(0,0,0,.25); }
.sheet-wrap.open .sheet-scrim { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; opacity: 1; }
.sheet-wrap.full .sheet { height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 6px; padding-top: max(16px, env(safe-area-inset-top)); }
.sheet-wrap:not(.full) .sheet-head { padding-top: 16px; }
.sheet-title { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: var(--title-weight, 700); line-height: 1.2; }
.sheet-x { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.sheet-body { overflow-y: auto; padding: 6px 18px 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
@media (min-width: 620px) { .sheet-wrap { align-items: center; } .sheet { border-radius: var(--r-sheet, 20px); } .sheet-wrap.full .sheet { height: 92vh; border-radius: var(--r-sheet, 20px); } }

/* Bottle detail */
.bd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bd-total { text-align: right; flex-shrink: 0; }
.bd-total b { display: block; font-family: var(--font-num); font-size: 34px; line-height: 1; color: var(--count-ink, var(--accent)); font-variant-numeric: tabular-nums; }
.bd-total span { font-size: 12.5px; color: var(--muted); }
.bd-meta { margin-top: 10px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bd-notes { margin-top: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); font-size: 14.5px; }
.where { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.where-row { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.where-place { font-size: 15.5px; min-width: 0; }
.where-ctrl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.where-ctrl .btn { margin-left: auto; }
.where-n { min-width: 30px; text-align: center; font-family: var(--font-num); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bd-foot { display: flex; justify-content: space-between; margin-top: 16px; }
.from-one { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); border: 1.5px solid var(--line); }
.qty-row { display: flex; gap: 10px; align-items: center; }

/* Fields */
.field { display: block; margin-bottom: 12px; min-width: 0; }
.field > span:first-child { display: block; font-size: 13.5px; font-weight: 650; color: var(--muted); margin-bottom: 5px; }
.field input, .field textarea, .search-box input, .add-line input, .inline-edit input, .scanner-manual input {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r); border: 1.5px solid var(--line-strong, var(--line)); background: var(--input-bg, var(--surface-2)); color: var(--ink); font-size: 16px; outline: none; }
.field input:focus, .field textarea:focus, .search-box input:focus, .add-line input:focus, .inline-edit input:focus { border-color: var(--accent); }
.field textarea { resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.with-btn { display: flex; gap: 6px; }
.with-btn .icon-btn { height: 46px; width: 46px; flex-shrink: 0; }
.bform .chips { margin: -4px 0 14px; }
.form-err { color: var(--danger); font-weight: 600; margin: 10px 0 0; min-height: 1em; }
.form-err:empty { display: none; }

.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line-strong, var(--line)); border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.stepper button { width: 48px; height: 48px; border: 0; background: none; font-size: 22px; font-weight: 600; }
.stepper input { width: 64px; height: 48px; border: 0; border-left: 1.5px solid var(--line); border-right: 1.5px solid var(--line); text-align: center; background: var(--input-bg, transparent); font-family: var(--font-num); font-size: 20px; font-weight: 700; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.search-box { margin-bottom: 12px; }
.pick-list { display: grid; gap: 8px; }
.pick-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface-2); margin-bottom: 8px; }
.pick-n { font-family: var(--font-num); font-weight: 700; font-size: 18px; }

/* Toast */
.toast { width: max-content; position: fixed; left: 50%; bottom: calc(var(--toast-bottom, 24px) + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 120; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 28px); padding: 10px 10px 10px 16px; border-radius: var(--r); background: var(--toast-bg, #222); color: var(--toast-ink, #fff); box-shadow: 0 8px 30px rgba(0,0,0,.3); font-size: 14.5px; transition: transform .2s, opacity .2s; }
html.locked .toast { bottom: auto; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -20px); }
html.locked .toast.show { transform: translate(-50%, 0); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; border-radius: calc(var(--r) - 2px); background: var(--toast-btn, rgba(255,255,255,.16)); color: inherit; font-weight: 700; padding: 8px 12px; }
.toast span { min-width: 0; }

/* Banner */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 14px; border-radius: var(--r); background: var(--banner-bg, var(--surface-2)); color: var(--banner-ink, var(--ink)); border: 1.5px solid var(--banner-line, var(--line)); font-size: 14.5px; margin-bottom: 14px; }
.banner .btn { white-space: nowrap; flex-shrink: 0; }
.banner.bad { background: var(--danger); color: #fff; border-color: var(--danger); }

/* Scanner */
.scanner { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
.scanner-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.scanner-head h2 { margin: 0; font-size: 19px; font-family: var(--font-display); }
.scanner .sheet-x { background: rgba(255,255,255,.15); color: #fff; }
.scanner-view { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; background: #111; }
.scanner-view video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner-frame { position: absolute; left: 10%; right: 10%; top: 32%; bottom: 32%; border: 3px solid var(--scan-frame, #fff); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); transition: border-color .15s; }
.scanner.flash .scanner-frame { border-color: #6fdc8c; }
.scanner.no-cam .scanner-view { flex: 0 0 120px; }
.scanner-msg { text-align: center; font-size: 15px; margin: 12px 0; min-height: 1.4em; }
.scanner-manual { display: flex; gap: 8px; }
.scanner-manual input { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
.scanner-manual input::placeholder { color: rgba(255,255,255,.6); }

/* Count check */
.cc-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cc-prog { font-size: 15px; }
.cc-prog b { font-family: var(--font-num); font-size: 20px; }
.cc-prog .warn { color: var(--warn); font-weight: 700; }
.cc-tools { display: flex; gap: 8px; }
.cc-progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 10px 0 14px; }
.cc-progress i { display: block; height: 100%; background: var(--ok); transition: width .2s; }
.cc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.cc-row.ok { border-color: var(--ok); }
.cc-row.off { border-color: var(--warn); }
.cc-info { min-width: 0; flex: 1 1 180px; }
.cc-where { font-size: 13.5px; margin-top: 6px; }
.cc-exp { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
.cc-ctrl { display: flex; align-items: center; gap: 6px; }
.cc-n { min-width: 30px; text-align: center; font-family: var(--font-num); font-size: 22px; font-weight: 700; }
.cc-row.off .cc-n { color: var(--warn); }
.ok-btn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.fix-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.fix-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); }
.fix-n { font-family: var(--font-num); white-space: nowrap; }

/* Import */
.imp-file { margin: 0 0 10px; word-break: break-all; }
.imp-stats { display: flex; gap: 10px; margin-bottom: 10px; }
.imp-stats div { flex: 1; padding: 12px; border-radius: var(--r); background: var(--surface-2); }
.imp-stats b { display: block; font-family: var(--font-num); font-size: 26px; line-height: 1.1; }
.imp-stats span { font-size: 13px; color: var(--muted); }
details { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-weight: 650; padding: 6px 0; }
.imp-list { margin: 6px 0 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }

/* Settings */
.settings { display: grid; gap: 14px; }
.set-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.set-card h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: 18px; }
.set-card p { margin: 0 0 10px; font-size: 14.5px; }
.set-card.demo { border-color: var(--accent); }
.loc-block { padding: 12px 0; border-top: 1px solid var(--line); }
.loc-block:first-of-type { border-top: 0; padding-top: 4px; }
.loc-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.loc-line b { font-size: 16.5px; }
.loc-tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.loc-tools .icon-btn { width: 34px; height: 34px; }
.spot-list { list-style: none; margin: 6px 0; padding: 0 0 0 12px; border-left: 2px solid var(--line); }
.spot-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 0; font-size: 15px; }
.add-line, .inline-edit { display: flex; gap: 8px; margin-top: 8px; }
.add-line input, .inline-edit input { min-height: 40px; min-width: 0; }
.add-line .btn, .inline-edit .btn { white-space: nowrap; flex-shrink: 0; }
.inline-edit { flex: 1; margin-top: 0; }

/* History */
.hist-day { font-size: 14px; color: var(--muted); margin: 16px 0 6px; font-family: var(--font); }
.hist-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.hist-list li { display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.hist-list time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13.5px; padding-top: 1px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* Long-list picker */
.picker-search { position: sticky; top: -6px; z-index: 3; background: var(--sheet-bg, var(--surface)); padding-top: 6px; margin-top: -6px; }
.picker-tools { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: var(--muted); margin: -4px 0 6px; }
.picker-sel:empty { display: none; }
.picker-sel { margin-bottom: 10px; }
.picker-list { list-style: none; margin: 0; padding: 0; }
.picker-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0 4px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: 16px; }
.picker-row.on { font-weight: 700; }
.picker-check { flex: 0 0 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line-strong, var(--line)); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
.picker-row.on .picker-check { background: var(--chip-on); border-color: var(--chip-on); color: var(--on-chip-on); }
.picker-label { flex: 1; min-width: 0; }
.picker-count { font-family: var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Finish line: between the name and the tags in prominence */
.b-fin { margin-top: 4px; font-size: 16px; font-weight: 700; line-height: 1.25; color: var(--fin-ink, var(--tag-finish-ink)); }
.b-fin .b-fin-mo { font-weight: 600; opacity: .85; }
.b-fin.none { font-size: 14px; font-weight: 500; color: var(--muted); }
.b-fin + .tags { margin-top: 6px; }
.bd-head .b-fin { font-size: 18px; }

.app { max-width: 640px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(170px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; min-height: 48px; }
.top-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .back { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 44px; margin-left: -10px; border: 0; background: none; color: var(--accent-text); }
.top .sum { text-align: right; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.top .sum b { display: block; font-size: 26px; font-weight: 800; color: var(--count-ink); line-height: 1; font-variant-numeric: tabular-nums; }

/* Search */
.finder { position: sticky; top: 0; z-index: 12; margin: 0 -16px; padding: 8px 16px 10px; background: var(--bg); }
.strip { display: flex; align-items: center; background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 4px 4px 4px 14px; }
.strip:focus-within { border-color: var(--accent); }
.strip > svg { color: var(--muted); flex-shrink: 0; }
.strip input { flex: 1; min-width: 0; border: 0; outline: none; background: none; padding: 10px; font-size: 17px; color: var(--ink); }
.strip input::placeholder { color: #8F8473; }
.strip input::-webkit-search-cancel-button { display: none; }
.clear-q { border: 0; background: none; color: var(--muted); font-size: 22px; width: 36px; height: 40px; }
.scan-btn { display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 15px; flex-shrink: 0; }
.sg-box { position: absolute; left: 16px; right: 16px; top: calc(100% - 4px); z-index: 13; background: var(--sheet-bg); border: 1.5px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: 0 16px 40px rgba(70,45,20,.22); overflow: hidden; }
.sg-box:empty { display: none; }
.sg-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 16px; }
.sg-row:first-child { border-top: 0; }
.sg-row:focus-visible, .sg-row:active { background: var(--surface-2); }
.sg-row .kind { flex: 0 0 66px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.sg-row .lbl { flex: 1; min-width: 0; }
.sg-row .lbl mark { background: none; color: var(--accent-text); font-weight: 800; }
.sg-row .cnt { font-weight: 800; color: var(--count-ink); font-variant-numeric: tabular-nums; }
.sg-hint { padding: 10px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

/* Filter rails */
.rails { display: grid; gap: 8px; margin-top: 4px; }
.rail { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rail-label { flex: 0 0 50px; font-size: 13px; font-weight: 700; color: var(--muted); }
.rail .chips { min-width: 0; flex: 1; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
.rail .chips::-webkit-scrollbar { display: none; }
.rail .chip { flex-shrink: 0; min-height: 38px; padding: 0 13px; font-size: 14px; background: var(--surface); }
.rail .chip small { font-weight: 700; color: var(--muted); }
.rail .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: var(--on-chip-on); }
.rail .chip.on small { color: inherit; }
.rail .chip.all { background: transparent; border-style: dashed; color: var(--accent-text); }
.active-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.active-row:empty { display: none; }
.active-row .chip { min-height: 32px; font-size: 13.5px; background: var(--tag-finish-bg); color: var(--tag-finish-ink); border-color: transparent; }

/* The building map: the one memorable thing */
.map-h { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
.map-h h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.map-h span { font-size: 13.5px; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 10px; }
.room { border: 2px solid var(--wall); border-radius: 6px; background: var(--surface); padding: 10px; }
.room-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 2px 8px; }
.room-h b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.room-h span { font-weight: 800; font-size: 18px; color: var(--count-ink); font-variant-numeric: tabular-nums; }
.room-h small { font-weight: 600; font-size: 13px; color: var(--muted); margin-left: 4px; }
.spots { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 6px; }
.spot { position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 6px; min-height: 64px; padding: 8px 9px; border: 1.5px dashed var(--line-strong); border-radius: 4px; background: var(--input-bg); color: var(--ink); text-align: left; font-size: 13.5px; line-height: 1.2; }
.spot .sn { font-weight: 600; }
.spot .sc { font-size: 20px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.spot.has .sc { color: var(--ink); }
.spot.loose { border-style: dotted; }
.map.filtering .spot { opacity: .38; }
.map.filtering .spot.lit { opacity: 1; background: var(--turq); border: 1.5px solid var(--turq); color: #FFFFFF; }
.map.filtering .spot.lit .sc { color: #FFFFFF; }
.map.filtering .spot.lit::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF; }
.room-empty { font-size: 13.5px; color: var(--muted); padding: 2px 2px 4px; }
.dim-rooms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.dim-rooms .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
.dim-room { border: 1.5px solid var(--line-strong); border-radius: 4px; padding: 6px 10px; font-size: 13.5px; color: var(--muted); background: none; }

.loc-strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 14px -16px 0; padding: 0 16px; }
.loc-strip::-webkit-scrollbar { display: none; }
.loc-pill { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1.5px solid var(--wall); border-radius: 4px; background: none; color: var(--ink); font-size: 14px; }
.loc-pill b { color: var(--count-ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.map { animation: mapIn .18s ease-out; }
@keyframes mapIn { from { opacity: 0; transform: translateY(-4px); } }
.result-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 22px 0 10px; font-size: 14.5px; color: var(--muted); min-height: 36px; }
.result-line b { color: var(--ink); }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); }
.empty .btn { margin-top: 12px; }

/* Spot sheet rows */
.srows { list-style: none; margin: 0; padding: 0; border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; }
.srow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; background: var(--surface-2); }
.srow:first-child { border-top: 0; }
.srow .nm { font-weight: 650; font-size: 16px; }
.srow .fin { font-size: 15px; font-weight: 700; color: var(--tag-finish-ink); margin-top: 1px; }
.srow .fin.none { font-weight: 500; color: var(--muted); font-size: 14px; }
.srow .sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.srow .ct { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.spot-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: var(--muted); }

.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 16px; border-radius: 26px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 15.5px; box-shadow: 0 8px 24px rgba(70,45,20,.22); }
.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; display: flex; justify-content: center; }
.tabs-in { display: flex; gap: 2px; padding: 5px; width: 100%; max-width: 480px; background: var(--basalt); border: 1.5px solid var(--line-strong); border-radius: 999px; box-shadow: 0 10px 30px rgba(70,45,20,.22); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 54px; border: 0; border-radius: 999px; background: none; color: #CDBFA6; font-weight: 700; font-size: 12px; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-current="page"] { background: var(--accent); color: var(--on-accent); }

.page-sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.count-loc { background: var(--surface); border: 2px solid var(--wall); border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
.count-loc-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.count-loc-h b { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.count-loc .chips { margin-top: 10px; }

/* Settings menu and pages */
.menu { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.menu + .menu { margin-top: 14px; }
.menu-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.menu li:first-child .menu-row { border-top: 0; }
.menu-row .mt { flex: 1; min-width: 0; }
.menu-row .mt b { display: block; font-size: 16.5px; font-weight: 650; }
.menu-row .mt span { display: block; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.menu-row .chev { color: var(--muted); }
.menu-row.danger b { color: var(--danger); }
.menu-note { font-size: 13.5px; color: var(--muted); margin: 8px 4px 0; }

.place-card { background: var(--surface); border: 2px solid var(--wall); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
.pc-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-h .nm { font-family: var(--font-display); font-size: 20px; flex: 1; min-width: 120px; }
.pc-h .ct { color: var(--muted); font-size: 13.5px; }
.ord { display: inline-flex; gap: 4px; }
.ord .icon-btn { width: 36px; height: 36px; font-size: 16px; }
.pc-spots { list-style: none; margin: 10px 0 4px; padding: 0; }
.pc-spot { display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 4px 0 4px 10px; border-top: 1px solid var(--line); }
.pc-spot .nm { flex: 1; min-width: 0; font-size: 15.5px; overflow-wrap: anywhere; }
.pc-spot .ct { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; margin-left: 4px; }
.pc-spot .ord .icon-btn { width: 36px; height: 36px; }
.pc-spot .icon-btn.rm { color: var(--danger); font-size: 20px; }
.pc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.add-place { background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 14px; }
.add-place h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.list-rows { list-style: none; margin: 10px 0; padding: 0; border: 1.5px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.list-row { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 4px 6px 4px 14px; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .nm { flex: 1; font-size: 15.5px; }
.list-row .ct { color: var(--muted); font-size: 13.5px; }
.list-row button { border: 0; background: none; color: var(--muted); width: 40px; height: 40px; font-size: 20px; }
.set-section { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; }
.set-section h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.set-section p { margin: 0 0 12px; font-size: 14.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" type="button"></button>
<nav class="tabs" aria-label="Pages"><div class="tabs-in" id="tabs"></div></nav>

<script>
/* ===== Core: data, storage, Excel, moves, count check, history, undo ===== */
const Core = (() => {
  "use strict";
  const KEY = "tastingroom-inventory-v2";
  const OLD_KEY = "stockroom-inventory-v1";
  const OLD_ARCHIVE = "stockroom-archive-v1";
  const MAIN_LOCATIONS = ["Landing", "Chapel", "Office", "Library"];
  const DEFAULT_TYPES = ["Bourbon", "Wheated Bourbon", "Rye", "Double Rye", "Single Malt", "American Malt", "Blend"];
  const DEFAULT_FINISHES = ["Cognac", "Malbec", "Cacao", "Port", "Sherry", "Rum", "Maple", "Cabernet", "Coffee", "Toasted Oak"];
  const DEFAULT_BASES = ["Bourbon", "Rye", "Bourbon & Rye Blend", "Bourbon, Rye & Scotch Blend", "Single Malt", "Oat", "Wheat", "Gin"];
  const BASE_ALIAS = { "bourbon rye blend": "Bourbon & Rye Blend", "bourbon & rye blend": "Bourbon & Rye Blend", "bourbon and rye blend": "Bourbon & Rye Blend",
    "bourbon, rye & scotch blend": "Bourbon, Rye & Scotch Blend", "bourbon rye & scotch blend": "Bourbon, Rye & Scotch Blend", "bourbon rye and scotch blend": "Bourbon, Rye & Scotch Blend",
    "oat whiskey": "Oat", "wheat whiskey": "Wheat", "wheated bourbon": "Bourbon", "double rye": "Rye", "rye whiskey": "Rye", "malt": "Single Malt", "straight malt": "Single Malt" };
  const fixBase = (v) => { const t = String(v || "").trim(); if (!t) return ""; const n = t.toLowerCase().replace(/\s+/g, " "); if (BASE_ALIAS[n]) return BASE_ALIAS[n]; const hit = DEFAULT_BASES.find((x) => x.toLowerCase() === n); return hit || t; };
  const DAY = 86400000;

  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
  const norm = (s) => String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const numOrBlank = (v) => {
    if (v === null || v === undefined || String(v).trim() === "") return "";
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? "" : n;
  };

  /* ABV in percent. Accepts "50.5", "50.5%", 0.505 (Excel percent cells), or falls back to proof / 2. */
  function toAbv(abv, proof) {
    let a = numOrBlank(abv);
    if (a !== "" && a > 0 && a <= 1.5) a = Math.round(a * 1000) / 10;
    if (a === "") { const p = numOrBlank(proof); if (p !== "") a = Math.round((p / 2) * 100) / 100; }
    return a;
  }
  let S = null;
  let storageOk = true;
  const undoStack = [];
  const subs = new Set();

  function blank() {
    return {
      v: 2,
      locations: MAIN_LOCATIONS.map((name) => ({ id: uid(), name, spots: [] })),
      types: [...DEFAULT_TYPES],
      finishes: [...DEFAULT_FINISHES],
      bases: [...DEFAULT_BASES],
      basesV2: true,
      bottles: [],
      stock: [],
      history: [],
      lastBackupAt: null,
      lastChangeAt: null,
      demo: false,
    };
  }

  function addStockRaw(s, bottleId, locId, spotId, delta) {
    let row = s.stock.find((r) => r.bottleId === bottleId && r.locId === locId && (r.spotId || "") === (spotId || ""));
    if (!row) {
      row = { id: uid(), bottleId, locId, spotId: spotId || "", count: 0 };
      s.stock.push(row);
    }
    row.count = Math.max(0, row.count + delta);
    return row;
  }

  function demo() {
    const s = blank();
    s.demo = true;
    const L = Object.fromEntries(s.locations.map((l) => [l.name, l]));
    const spot = (loc, name) => { const sp = { id: uid(), name }; L[loc].spots.push(sp); return sp.id; };
    const sp = {
      bar: spot("Landing", "Back bar"), wall: spot("Landing", "Display wall"),
      north: spot("Chapel", "North shelf"), table: spot("Chapel", "Tasting table"),
      safe: spot("Office", "Safe"), cab: spot("Office", "Desk cabinet"),
      a: spot("Library", "Cabinet 1"), b: spot("Library", "Cabinet 2"), cart: spot("Library", "Reading cart"),
    };
    const add = (f, places) => {
      const id = uid();
      const DEMO_BASE = { "Bourbon": "Bourbon", "Double Rye": "Rye", "Rye": "Rye", "Single Malt": "Single Malt", "Wheated Bourbon": "Bourbon", "Blend": "Bourbon & Rye Blend" };
      s.bottles.push({ id, name: f[0], type: "", base: DEMO_BASE[f[1]] || "", finish: f[2], finishMonths: f[3], abv: f[4], barrel: f[5], barcode: f[6], notes: f[7] || "", createdAt: Date.now() });
      places.forEach(([loc, spotId, count]) => addStockRaw(s, id, L[loc].id, spotId, count));
    };
    add(["Founder's Reserve", "Bourbon", "Cognac", 8, 52, "47", "850012345671"], [["Chapel", sp.north, 3], ["Library", sp.a, 1]]);
    add(["Founder's Reserve", "Bourbon", "Malbec", 12, 52, "52", "850012345671"], [["Library", sp.a, 4]]);
    add(["Founder's Reserve", "Bourbon", "Rum", 9, 52, "55", "850012345671"], [["Landing", sp.bar, 1], ["Library", sp.cart, 2]]);
    add(["Cellar Door", "Double Rye", "Cacao", 6, 56, "18", "850012345688"], [["Landing", sp.bar, 2], ["Office", sp.safe, 1]]);
    add(["Cellar Door", "Double Rye", "Port", 10, 56, "21", "850012345688"], [["Chapel", sp.table, 3]]);
    add(["Cellar Door", "Double Rye", "Coffee", 5, 56, "24", "850012345688"], [["Library", sp.b, 1]]);
    add(["Highland Hymn", "Single Malt", "Sherry", 14, 49, "9", "850012345695"], [["Library", sp.b, 2]]);
    add(["Highland Hymn", "Single Malt", "Cabernet", 11, 49, "12", ""], [["Chapel", sp.table, 2]]);
    add(["Sunday Wheat", "Wheated Bourbon", "", "", 47, "63", "850012345701"], [["Landing", sp.wall, 36], ["Office", sp.cab, 4]]);
    add(["Maple Hour", "Rye", "Maple", 4, 50, "30", "850012345718"], [["Chapel", sp.north, 2]]);
    add(["Single Barrel Select", "Bourbon", "", "", 60.5, "112", "850012345725", "Signed by the distiller"], [["Office", sp.safe, 3]]);
    add(["Vestry Blend", "Blend", "Toasted Oak", 3, 45, "", "850012345732"], [["Landing", sp.wall, 30]]);
    const now = Date.now();
    s.history.push({ t: now - 3 * DAY, text: "Loaded sample inventory" });
    s.history.push({ t: now - 2 * DAY, text: "Moved 2 Cellar Door, Double Rye, Cacao from Office › Safe to Landing › Back bar" });
    s.history.push({ t: now - DAY, text: "Count check: Library › Cabinet 1, 1 fix" });
    s.lastBackupAt = now - 9 * DAY;
    s.lastChangeAt = now - DAY;
    return s;
  }

  function placeFromText(s, text) {
    const t = String(text || "").trim();
    const loc = s.locations.find((l) => norm(l.name) === norm(t));
    if (loc) return { locId: loc.id, spotId: "" };
    for (const l of s.locations) {
      const sp = l.spots.find((x) => norm(x.name) === norm(t));
      if (sp) return { locId: l.id, spotId: sp.id };
    }
    let un = s.locations.find((l) => l.name === "Unsorted");
    if (!un) { un = { id: uid(), name: "Unsorted", spots: [] }; s.locations.push(un); }
    if (!t) return { locId: un.id, spotId: "" };
    const sp = { id: uid(), name: t };
    un.spots.push(sp);
    return { locId: un.id, spotId: sp.id };
  }

  function migrateOld() {
    let items, archive;
    try {
      items = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
      archive = JSON.parse(localStorage.getItem(OLD_ARCHIVE) || "null");
    } catch (e) { return null; }
    const all = { ...(archive || {}), ...(items || {}) };
    if (!Object.keys(all).length) return null;
    const s = blank();
    const byKey = {};
    for (const [key, v] of Object.entries(all)) {
      const barcode = v.noBarcode ? "" : String(v.sharedBarcode || key.split("::")[0]);
      const name = v.name || "Unnamed bottle";
      const barrel = v.batch || "";
      const k = [norm(name), norm(barcode), norm(barrel)].join("|");
      let b = byKey[k];
      if (!b) {
        b = { id: uid(), name, type: "", base: "", finish: "", finishMonths: "", abv: "", barrel, barcode, notes: v.notes || "", createdAt: Date.now() };
        byKey[k] = b;
        s.bottles.push(b);
      }
      const place = placeFromText(s, v.location || "");
      addStockRaw(s, b.id, place.locId, place.spotId, Math.max(0, Number(v.count) || 0));
    }
    s.stock = s.stock.filter((r) => r.count > 0);
    s.history.push({ t: Date.now(), text: `Brought over ${s.bottles.length} bottles from the old Stockroom app` });
    s.lastChangeAt = Date.now();
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        S = JSON.parse(raw);
        S.bottles.forEach((b) => { b.base = fixBase(b.base); });
        if (!Array.isArray(S.bases) || !S.basesV2) { S.bases = [...DEFAULT_BASES]; S.basesV2 = true; }
        S.bottles.forEach((b) => { if (b.abv === undefined) { b.abv = toAbv("", b.proof); delete b.proof; } });
        return;
      }
    } catch (e) { storageOk = false; }
    S = migrateOld() || demo();
    save();
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
      storageOk = true;
    } catch (e) {
      storageOk = false;
    }
    return storageOk;
  }

  const emit = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  const on = (fn) => { subs.add(fn); return () => subs.delete(fn); };

  function log(text) {
    S.history.unshift({ t: Date.now(), text });
    if (S.history.length > 1500) S.history.length = 1500;
  }

  function commit(label, fn) {
    undoStack.push({ label, snap: JSON.stringify(S) });
    if (undoStack.length > 40) undoStack.shift();
    fn();
    S.stock = S.stock.filter((r) => r.count > 0);
    S.lastChangeAt = Date.now();
    log(label);
    save();
    emit();
  }

  function undo() {
    const last = undoStack.pop();
    if (!last) return null;
    S = JSON.parse(last.snap);
    log(`Undid: ${last.label}`);
    save();
    emit();
    return last.label;
  }
  const canUndo = () => undoStack.length > 0;
  const lastUndoLabel = () => (undoStack.length ? undoStack[undoStack.length - 1].label : "");

  /* ---------- Lookups ---------- */
  const state = () => S;
  const loc = (id) => S.locations.find((l) => l.id === id);
  const spot = (locId, spotId) => { const l = loc(locId); return l && spotId ? l.spots.find((s) => s.id === spotId) : null; };
  const bottle = (id) => S.bottles.find((b) => b.id === id);
  const placeName = (locId, spotId) => {
    const l = loc(locId); const sp = spot(locId, spotId);
    return (l ? l.name : "Unknown") + (sp ? ` › ${sp.name}` : "");
  };
  const finishText = (b) => (b.finish ? `${b.finish}${b.finishMonths !== "" && b.finishMonths != null ? `, ${b.finishMonths} mo` : ""}` : "No finish");
  const fullName = (b) => [b.name, b.finish ? `${b.finish} finish` : ""].filter(Boolean).join(", ");
  const stockFor = (bottleId) => S.stock.filter((r) => r.bottleId === bottleId && r.count > 0)
    .sort((a, b) => S.locations.indexOf(loc(a.locId)) - S.locations.indexOf(loc(b.locId)) || placeName(a.locId, a.spotId).localeCompare(placeName(b.locId, b.spotId)));
  const totalFor = (bottleId) => stockFor(bottleId).reduce((n, r) => n + r.count, 0);
  const totalAll = () => S.stock.reduce((n, r) => n + r.count, 0);
  const rowsAt = (locId, spotId) => S.stock.filter((r) => r.count > 0 && r.locId === locId && (spotId === undefined || spotId === null || (r.spotId || "") === spotId));
  const totalAt = (locId, spotId) => rowsAt(locId, spotId).reduce((n, r) => n + r.count, 0);
  const byBarcode = (code) => { const c = norm(code); return c ? S.bottles.filter((b) => norm(b.barcode) === c) : []; };

  function haystack(b) {
    return norm([b.name, b.type, b.base, b.finish, b.finish ? `${b.finish} finish` : "no finish", b.barrel ? `barrel ${b.barrel} #${b.barrel}` : "", b.barcode, b.notes, b.abv !== "" && b.abv != null ? `${b.abv}% abv ${b.abv} abv` : ""].join(" "));
  }

  /* filters: { q, types:[], finishes:[], locs:[], showEmpty } */
  function filterBottles(f = {}) {
    const tokens = norm(f.q).split(" ").filter(Boolean);
    const out = [];
    for (const b of S.bottles) {
      if (f.types && f.types.length && !f.types.includes(b.type)) continue;
      if (f.names && f.names.length && !f.names.includes(b.name)) continue;
      if (f.finishes && f.finishes.length && !f.finishes.includes(b.finish || "")) continue;
      if (f.bases && f.bases.length && !f.bases.includes(b.base || "")) continue;
      if (f.barrel && norm(b.barrel) !== norm(f.barrel)) continue;
      let rows = stockFor(b.id);
      if (f.locs && f.locs.length) rows = rows.filter((r) => f.locs.includes(r.locId));
      if (f.spots && f.spots.length) rows = rows.filter((r) => f.spots.includes(r.locId + "|" + (r.spotId || "")));
      const total = rows.reduce((n, r) => n + r.count, 0);
      if (!f.showEmpty && total === 0) continue;
      if (f.locs && f.locs.length && rows.length === 0) continue;
      if (f.spots && f.spots.length && rows.length === 0) continue;
      if (tokens.length) { const h = haystack(b); if (!tokens.every((t) => h.includes(t))) continue; }
      out.push({ b, rows, total });
    }
    out.sort((x, y) => x.b.name.localeCompare(y.b.name) || finishText(x.b).localeCompare(finishText(y.b)) || String(x.b.barrel).localeCompare(String(y.b.barrel), undefined, { numeric: true }));
    return out;
  }
  const filterActive = (f) => !!(norm(f.q) || f.barrel || (f.names && f.names.length) || (f.bases && f.bases.length) || (f.spots && f.spots.length) || (f.types && f.types.length) || (f.finishes && f.finishes.length) || (f.locs && f.locs.length));
  /* on-hand units per value of a field, under every filter except that field's own */
  function facetCounts(field, f = {}) {
    const key = field === "type" ? "types" : field === "finish" ? "finishes" : field === "base" ? "bases" : field === "name" ? "names" : null;
    const g = { ...f, showEmpty: false };
    if (key) g[key] = [];
    const m = new Map();
    filterBottles(g).forEach(({ b, total }) => { const k = b[field] || ""; m.set(k, (m.get(k) || 0) + total); });
    return m;
  }
  function locCounts(f = {}) {
    const m = new Map();
    filterBottles({ ...f, locs: [] }).forEach(({ rows }) => rows.forEach((r) => m.set(r.locId, (m.get(r.locId) || 0) + r.count)));
    return m;
  }
  /* on-hand units per "locId|spotId" under the current filters */
  function spotCounts(f = {}) {
    const m = new Map();
    filterBottles(f).forEach(({ rows }) => rows.forEach((r) => { const k = r.locId + "|" + (r.spotId || ""); m.set(k, (m.get(k) || 0) + r.count); }));
    return m;
  }
  /* how many bottles use each type/finish (for ranking pick lists) */
  function usage(field) {
    const m = new Map();
    S.bottles.forEach((b) => { if (b[field]) m.set(b[field], (m.get(b[field]) || 0) + 1 + totalFor(b.id) / 1000); });
    return m;
  }
  /* rank a list for a text query: starts-with first, then contains; no query = most used first */
  function rankList(list, q, field, limit = 8) {
    const n = norm(q); const use = usage(field);
    let out;
    if (!n) out = [...list].sort((a, b) => (use.get(b) || 0) - (use.get(a) || 0) || a.localeCompare(b));
    else {
      const hits = list.filter((x) => norm(x).includes(n));
      out = hits.sort((a, b) => (norm(b).startsWith(n) - norm(a).startsWith(n)) || (use.get(b) || 0) - (use.get(a) || 0) || a.localeCompare(b));
    }
    return out.slice(0, limit);
  }
  /* search-bar suggestions that turn typed text into a filter */
  function suggest(q, f = {}) {
    const n = norm(q); if (n.length < 2) return [];
    const out = [];
    const starts = (x) => norm(x).startsWith(n);
    const fc = facetCounts("finish", f), tc = facetCounts("type", f), lc = locCounts(f);
    const pick = (list, kind, counts) => list.filter((x) => x && norm(x).includes(n))
      .map((x) => ({ kind, value: x, label: x, count: counts.get(x) || 0, s: starts(x) }))
      .filter((x) => x.count > 0)
      .sort((a, b) => b.s - a.s || b.count - a.count || a.label.localeCompare(b.label));
    out.push(...pick(finishesInUse(), "finish", fc).slice(0, 4));
    out.push(...pick(namesInUse(), "name", facetCounts("name", f)).slice(0, 3));
    out.push(...pick(basesInUse(), "base", facetCounts("base", f)).slice(0, 2));
    out.push(...S.locations.filter((l) => norm(l.name).includes(n)).map((l) => ({ kind: "loc", value: l.id, label: l.name, count: lc.get(l.id) || 0, s: starts(l.name) })).filter((x) => x.count > 0));
    const scnt = spotCounts({ ...f, spots: [] });
    S.locations.forEach((l) => l.spots.forEach((sp) => {
      const full = `${l.name} ${sp.name}`;
      if (norm(sp.name).includes(n) || norm(full).includes(n)) {
        const k = l.id + "|" + sp.id;
        const c = scnt.get(k) || 0;
        if (c) out.push({ kind: "spot", value: k, label: `${l.name} › ${sp.name}`, count: c, s: starts(sp.name) });
      }
    }));
    const m = n.match(/^(?:barrel\s*#?|#)?\s*(\w+)$/);
    if (m) {
      const bc = new Map();
      filterBottles({ ...f, barrel: "" }).forEach(({ b, total }) => { if (b.barrel && norm(b.barrel) === m[1]) bc.set(b.barrel, (bc.get(b.barrel) || 0) + total); });
      bc.forEach((count, v) => out.unshift({ kind: "barrel", value: v, label: `Barrel ${v}`, count, s: true }));
    }
    return out.slice(0, 8);
  }
  const typesInUse = () => [...new Set([...S.types, ...S.bottles.map((b) => b.type).filter(Boolean)])];
  const namesInUse = () => [...new Set(S.bottles.map((b) => b.name).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const basesInUse = () => [...new Set([...(S.bases || []), ...S.bottles.map((b) => b.base).filter(Boolean)])];
  const finishesInUse = () => [...new Set([...S.finishes, ...S.bottles.map((b) => b.finish).filter(Boolean)])];

  /* ---------- Mutations ---------- */
  function identity(f) {
    return [norm(f.name), norm(f.finish), norm(f.finishMonths), norm(f.barrel)].join("|");
  }
  /* Same bottle = same name, type, finish, finish time and barrel, plus the same ABV and barcode when both have one */
  const abvFits = (a, b) => a.abv === "" || a.abv == null || b.abv === "" || b.abv == null || Number(a.abv) === Number(b.abv);
  const codeFits = (a, b) => !a.barcode || !b.barcode || norm(a.barcode) === norm(b.barcode);
  const sameBottle = (a, b) => identity(a) === identity(b) && abvFits(a, b) && codeFits(a, b);
  const findSame = (f, s = S) => s.bottles.find((b) => sameBottle(b, f));

  function cleanFields(f) {
    return {
      name: String(f.name || "").trim() || String(f.type || "").trim() || "Unnamed bottle",
      type: "",
      base: fixBase(f.base),
      finish: String(f.finish || "").trim(),
      finishMonths: numOrBlank(f.finishMonths),
      abv: toAbv(f.abv, f.proof),
      barrel: String(f.barrel == null ? "" : f.barrel).trim(),
      barcode: String(f.barcode == null ? "" : f.barcode).trim(),
      notes: String(f.notes || "").trim(),
    };
  }
  function rememberLists(s, f) {
    if (f.type && !s.types.some((t) => norm(t) === norm(f.type))) s.types.push(f.type);
    if (f.finish && !s.finishes.some((t) => norm(t) === norm(f.finish))) s.finishes.push(f.finish);
    if (!Array.isArray(s.bases)) s.bases = [...DEFAULT_BASES];
    if (f.base && !s.bases.some((t) => norm(t) === norm(f.base))) s.bases.push(f.base);
  }

  /* returns { id, merged } */
  function addBottle(fields, place, count) {
    const f = cleanFields(fields);
    const same = findSame(f);
    let id = same ? same.id : uid();
    const n = Math.max(0, Math.round(count || 0));
    const where = place && place.locId ? ` to ${placeName(place.locId, place.spotId)}` : "";
    commit(same ? `Added ${n} ${fullName(same)}${where}` : `New bottle: ${fullName(f)}${n ? `, ${n}${where}` : ""}`, () => {
      if (!same) S.bottles.push({ id, ...f, createdAt: Date.now() });
      rememberLists(S, f);
      if (place && place.locId && n > 0) addStockRaw(S, id, place.locId, place.spotId || "", n);
    });
    return { id, merged: !!same };
  }

  function updateBottle(id, fields) {
    const b = bottle(id); if (!b) return;
    const f = cleanFields(fields);
    commit(`Edited ${fullName(f)}`, () => { Object.assign(bottle(id), f); rememberLists(S, f); });
  }

  function deleteBottle(id) {
    const b = bottle(id); if (!b) return;
    commit(`Deleted ${fullName(b)}`, () => {
      S.bottles = S.bottles.filter((x) => x.id !== id);
      S.stock = S.stock.filter((r) => r.bottleId !== id);
    });
  }

  function changeCount(bottleId, locId, spotId, delta) {
    const b = bottle(bottleId); if (!b || !delta) return;
    const sign = delta > 0 ? `+${delta}` : `${delta}`;
    commit(`${sign} ${fullName(b)} at ${placeName(locId, spotId)}`, () => addStockRaw(S, bottleId, locId, spotId, delta));
  }

  function setCount(bottleId, locId, spotId, n) {
    const b = bottle(bottleId); if (!b) return;
    const row = S.stock.find((r) => r.bottleId === bottleId && r.locId === locId && (r.spotId || "") === (spotId || ""));
    const before = row ? row.count : 0;
    if (before === n) return;
    commit(`Set ${fullName(b)} at ${placeName(locId, spotId)} to ${n} (was ${before})`, () => addStockRaw(S, bottleId, locId, spotId, n - before));
  }

  function move(bottleId, from, to, qty) {
    const b = bottle(bottleId); if (!b) return false;
    const row = S.stock.find((r) => r.bottleId === bottleId && r.locId === from.locId && (r.spotId || "") === (from.spotId || ""));
    const n = Math.min(row ? row.count : 0, Math.max(1, Math.round(qty)));
    if (!n) return false;
    if (from.locId === to.locId && (from.spotId || "") === (to.spotId || "")) return false;
    commit(`Moved ${n} ${fullName(b)} from ${placeName(from.locId, from.spotId)} to ${placeName(to.locId, to.spotId)}`, () => {
      addStockRaw(S, bottleId, from.locId, from.spotId, -n);
      addStockRaw(S, bottleId, to.locId, to.spotId, n);
    });
    return n;
  }

  /* ---------- Locations, spots, lists ---------- */
  function addLocation(name) {
    name = String(name || "").trim(); if (!name) return;
    if (S.locations.some((l) => norm(l.name) === norm(name))) return "exists";
    commit(`Added location ${name}`, () => S.locations.push({ id: uid(), name, spots: [] }));
  }
  function renameLocation(id, name) {
    name = String(name || "").trim(); const l = loc(id); if (!l || !name || l.name === name) return;
    const old = l.name;
    commit(`Renamed location ${old} to ${name}`, () => { loc(id).name = name; });
  }
  function removeLocation(id) {
    const l = loc(id); if (!l) return;
    if (totalAt(id) > 0) return "not-empty";
    commit(`Removed location ${l.name}`, () => { S.locations = S.locations.filter((x) => x.id !== id); });
  }
  function moveLocation(id, dir) {
    const i = S.locations.findIndex((l) => l.id === id); const j = i + dir;
    if (i < 0 || j < 0 || j >= S.locations.length) return;
    commit(`Reordered locations`, () => { const [x] = S.locations.splice(i, 1); S.locations.splice(j, 0, x); });
  }
  function moveSpot(locId, spotId, dir) {
    const l = loc(locId); if (!l) return;
    const i = l.spots.findIndex((s) => s.id === spotId); const j = i + dir;
    if (i < 0 || j < 0 || j >= l.spots.length) return;
    commit(`Reordered spots in ${l.name}`, () => { const L = loc(locId); const [x] = L.spots.splice(i, 1); L.spots.splice(j, 0, x); });
  }
  function addSpot(locId, name) {
    name = String(name || "").trim(); const l = loc(locId); if (!l || !name) return;
    if (l.spots.some((s) => norm(s.name) === norm(name))) return "exists";
    commit(`Added spot ${l.name} › ${name}`, () => loc(locId).spots.push({ id: uid(), name }));
  }
  function renameSpot(locId, spotId, name) {
    name = String(name || "").trim(); const sp = spot(locId, spotId); if (!sp || !name || sp.name === name) return;
    const old = placeName(locId, spotId);
    commit(`Renamed spot ${old} to ${name}`, () => { spot(locId, spotId).name = name; });
  }
  function removeSpot(locId, spotId) {
    const sp = spot(locId, spotId); if (!sp) return;
    const label = placeName(locId, spotId);
    commit(`Removed spot ${label}`, () => {
      S.stock.filter((r) => r.locId === locId && r.spotId === spotId).forEach((r) => {
        addStockRaw(S, r.bottleId, locId, "", r.count); r.count = 0;
      });
      const l = loc(locId); l.spots = l.spots.filter((s) => s.id !== spotId);
    });
  }
  function addListItem(list, value) {
    value = String(value || "").trim(); if (!value) return;
    if (S[list].some((t) => norm(t) === norm(value))) return "exists";
    commit(`Added ${list === "types" ? "type" : list === "bases" ? "base" : "finish"} ${value}`, () => S[list].push(value));
  }
  function removeListItem(list, value) {
    commit(`Removed ${list === "types" ? "type" : list === "bases" ? "base" : "finish"} ${value} from the pick list`, () => { S[list] = S[list].filter((t) => t !== value); });
  }

  /* ---------- Count check ---------- */
  /* results: [{ bottleId, locId, spotId, expected, found }] — found null = not checked */
  function applyCountCheck(label, results) {
    const fixes = results.filter((r) => r.found !== null && r.found !== r.expected);
    if (!fixes.length) { commit(`Count check: ${label}, all correct`, () => {}); return 0; }
    commit(`Count check: ${label}, ${fixes.length} fix${fixes.length === 1 ? "" : "es"}`, () => {
      fixes.forEach((r) => addStockRaw(S, r.bottleId, r.locId, r.spotId, r.found - r.expected));
    });
    return fixes.length;
  }

  /* ---------- Excel ---------- */
  const HEAD = {
    name: ["name", "bottle", "bottle name", "item", "item name", "product name", "description", "title"],
    type: ["type", "whiskey type", "whisky type", "product", "product line", "line", "category"],
    base: ["base", "base spirit", "made from", "mash", "spirit", "style"],
    finish: ["finish", "finished in", "cask finish", "barrel finish"],
    finishMonths: ["finish time (months)", "finish time", "finish months", "months", "finish length", "time in finish"],
    abv: ["abv", "abv (%)", "abv %", "% abv", "alcohol", "alcohol %"],
    proof: ["proof"],
    barrel: ["barrel", "barrel #", "barrel number", "barrel no", "barrel no.", "batch", "batch/lot", "lot"],
    barcode: ["barcode", "upc", "ean", "sku", "code", "barcode #", "barcode number"],
    location: ["location", "room", "area"],
    spot: ["spot", "shelf", "bin", "sub-location", "sublocation", "position"],
    count: ["count", "qty", "quantity", "bottles", "on hand", "units", "amount", "total"],
    notes: ["notes", "note", "comments", "comment", "remarks"],
  };

  function readRow(row) {
    const out = {};
    for (const k of Object.keys(row)) {
      const lk = norm(k);
      for (const [field, keys] of Object.entries(HEAD)) {
        if (out[field] === undefined && keys.includes(lk)) { out[field] = row[k]; break; }
      }
    }
    return out;
  }

  async function parseFile(file) {
    if (typeof XLSX === "undefined") throw new Error("The Excel tool didn't load. Connect to the internet and try again.");
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(sheet, { defval: "" }).map(readRow);
  }

  /* Runs rows against a copy of the inventory; returns { draft, merged, created, skipped } */
  function planImport(rows) {
    const draft = clone(S);
    const merged = [], created = [], skipped = [];
    const newIds = new Set();
    const hadSpots = new Set(draft.locations.filter((l) => l.spots.length).map((l) => l.id));
    rows.forEach((r, i) => {
      const rowNo = i + 2;
      if (!String(r.name || "").trim() && String(r.type || "").trim()) r.name = r.type;
      const hasName = String(r.name || "").trim() !== "";
      const code = String(r.barcode == null ? "" : r.barcode).trim();
      if (!hasName && !code) { skipped.push(`Row ${rowNo}: no name or barcode`); return; }
      const count = Math.max(0, Math.round(Number(String(r.count).replace(/[^0-9.\-]/g, "")) || 0));
      let b = null;
      let f = null;
      if (hasName) {
        f = cleanFields(r);
        b = draft.bottles.find((x) => sameBottle(x, f));
      } else {
        const hits = draft.bottles.filter((x) => norm(x.barcode) === norm(code));
        if (hits.length === 1) b = hits[0];
        else if (hits.length > 1) { skipped.push(`Row ${rowNo}: barcode ${code} fits ${hits.length} finishes. Add a name and finish.`); return; }
        else { skipped.push(`Row ${rowNo}: barcode ${code} isn't in your inventory and has no name`); return; }
      }
      let isNew = false;
      if (!b) {
        b = { id: uid(), ...f, createdAt: Date.now() };
        draft.bottles.push(b);
        rememberLists(draft, f);
        isNew = true;
        newIds.add(b.id);
      } else if (f) {
        if ((b.abv === "" || b.abv == null) && f.abv !== "") b.abv = f.abv;
        if (!b.barcode && f.barcode) b.barcode = f.barcode;
        if (!b.notes && f.notes) b.notes = f.notes;
        if (!b.base && f.base) b.base = f.base;
      }
      let place = null;
      const locName = String(r.location || "").trim();
      const spotName = String(r.spot || "").trim();
      if (count > 0) {
        let l = draft.locations.find((x) => norm(x.name) === norm(locName));
        if (!l && locName) { l = { id: uid(), name: locName, spots: [] }; draft.locations.push(l); }
        if (!l) place = placeFromText(draft, spotName);
        else if (!spotName) place = { locId: l.id, spotId: "" };
        else {
          let sp = l.spots.find((x) => norm(x.name) === norm(spotName));
          if (!sp) { sp = { id: uid(), name: spotName }; l.spots.push(sp); }
          place = { locId: l.id, spotId: sp.id };
        }
      }
      const label = [b.name, b.finish ? `${b.finish} finish` : ""].filter(Boolean).join(", ");
      const where = place ? (() => {
        const l = draft.locations.find((x) => x.id === place.locId);
        const sp = l && place.spotId ? l.spots.find((x) => x.id === place.spotId) : null;
        return (l ? l.name : "") + (sp ? ` › ${sp.name}` : "");
      })() : "";
      if (place) {
        const before = (draft.stock.find((x) => x.bottleId === b.id && x.locId === place.locId && (x.spotId || "") === (place.spotId || "")) || { count: 0 }).count;
        addStockRaw(draft, b.id, place.locId, place.spotId, count);
        if (newIds.has(b.id)) created.push(`${label}${b.barrel ? ", barrel " + b.barrel : ""}: ${count} at ${where}`);
        else merged.push(`${label}${b.barrel ? ", barrel " + b.barrel : ""} at ${where}: ${before} + ${count} = ${before + count}`);
      } else if (isNew) {
        created.push(`${label}: none in stock`);
      } else {
        skipped.push(`Row ${rowNo}: ${label} had a count of 0`);
      }
    });
    draft.stock = draft.stock.filter((r) => r.count > 0);
    draft.locations.forEach((l) => { if (!hadSpots.has(l.id)) l.spots.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true })); });
    return { draft, merged, created, skipped, newCount: newIds.size };
  }

  function applyImport(plan, fileName) {
    commit(`Imported ${fileName}: ${plan.merged.length} added to existing, ${plan.newCount} new bottles`, () => {
      const keepHistory = S.history;
      S = plan.draft;
      S.history = keepHistory;
    });
  }

  function exportRows() {
    const rows = [];
    const bottles = [...S.bottles].sort((a, b) => a.name.localeCompare(b.name) || finishText(a).localeCompare(finishText(b)));
    for (const b of bottles) {
      const base = { Name: b.name, Base: b.base || "", Finish: b.finish, "Finish Time (months)": b.finishMonths, "ABV (%)": b.abv, Barrel: b.barrel, Barcode: b.barcode };
      const st = stockFor(b.id);
      if (!st.length) rows.push({ ...base, Location: "", Spot: "", Count: 0, Notes: b.notes });
      st.forEach((r) => {
        const sp = spot(r.locId, r.spotId);
        rows.push({ ...base, Location: (loc(r.locId) || {}).name || "", Spot: sp ? sp.name : "", Count: r.count, Notes: b.notes });
      });
    }
    return rows;
  }

  function exportXlsx() {
    if (typeof XLSX === "undefined") throw new Error("The Excel tool didn't load. Connect to the internet and try again.");
    const rows = exportRows();
    const ws = XLSX.utils.json_to_sheet(rows, { header: ["Name", "Base", "Finish", "Finish Time (months)", "ABV (%)", "Barrel", "Barcode", "Location", "Spot", "Count", "Notes"] });
    ws["!cols"] = [28, 22, 22, 10, 8, 10, 16, 12, 16, 8, 40].map((wch) => ({ wch }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Inventory");
    const stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `bottle-inventory-${stamp}.xlsx`);
    S.lastBackupAt = Date.now();
    log(`Exported to Excel (${rows.length} rows)`);
    save();
    emit();
  }

  function backupStatus() {
    const changed = S.lastChangeAt && (!S.lastBackupAt || S.lastChangeAt > S.lastBackupAt);
    const days = S.lastBackupAt ? Math.floor((Date.now() - S.lastBackupAt) / DAY) : null;
    return { due: !!changed && (days === null || days >= 7), days, never: !S.lastBackupAt };
  }

  function clearSample() {
    const keepLocs = S.locations.filter((l) => MAIN_LOCATIONS.includes(l.name)).map((l) => ({ ...l, spots: [] }));
    commit("Cleared the sample bottles", () => {
      const fresh = blank();
      fresh.locations = keepLocs.length ? keepLocs : fresh.locations;
      fresh.history = S.history;
      S = fresh;
    });
    undoStack.length = 0;
  }
  function eraseAll() {
    S = blank();
    undoStack.length = 0;
    log("Erased everything");
    save();
    emit();
  }

  load();

  return {
    state, on, undo, canUndo, lastUndoLabel, isStorageOk: () => storageOk,
    loc, spot, bottle, placeName, finishText, fullName, stockFor, totalFor, totalAll, rowsAt, totalAt, byBarcode,
    filterBottles, filterActive, typesInUse, finishesInUse, basesInUse, namesInUse, DEFAULT_BASES, findSame, facetCounts, locCounts, rankList, suggest, usage,
    addBottle, updateBottle, deleteBottle, changeCount, setCount, move,
    addLocation, renameLocation, removeLocation, moveLocation, moveSpot, spotCounts, addSpot, renameSpot, removeSpot, addListItem, removeListItem,
    applyCountCheck, parseFile, planImport, applyImport, exportXlsx, backupStatus, clearSample, eraseAll, norm,
  };
})();

</script>
<script>
/* ===== Shared UI: sheets, bottle details, move, forms, scanner, count check, import, settings, history ===== */
const UI = (() => {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;

  /* ---------- Sheets ---------- */
  const openSheets = [];
  function sheet({ title = "", cls = "", top = false } = {}) {
    const wrap = document.createElement("div");
    wrap.className = `sheet-wrap ${cls}${top ? " on-top" : ""}`;
    wrap.innerHTML = `<div class="sheet-scrim" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head"><h2 class="sheet-title"></h2><button type="button" class="sheet-x" data-close aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <div class="sheet-body"></div>
      </div>`;
    document.body.appendChild(wrap);
    const closers = [];
    const api = {
      el: wrap,
      body: $(".sheet-body", wrap),
      setTitle(t) { $(".sheet-title", wrap).textContent = t; $(".sheet", wrap).setAttribute("aria-label", t); },
      onClose(fn) { closers.push(fn); },
      close() {
        if (!wrap.isConnected) return;
        closers.forEach((fn) => fn());
        wrap.classList.remove("open");
        const i = openSheets.indexOf(api); if (i >= 0) openSheets.splice(i, 1);
        setTimeout(() => wrap.remove(), 180);
        if (!openSheets.length) document.documentElement.classList.remove("locked");
      },
    };
    api.setTitle(title);
    wrap.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) api.close(); });
    openSheets.push(api);
    document.documentElement.classList.add("locked");
    requestAnimationFrame(() => wrap.classList.add("open"));
    return api;
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openSheets.length) openSheets[openSheets.length - 1].close();
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-open]")) { e.preventDefault(); openBottle(e.target.dataset.open); }
  });
  document.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]");
    if (o && !e.target.closest("button:not([data-open])")) { openBottle(o.dataset.open); return; }
    if (e.target.closest("[data-act='backup-now']")) doExport();
  });

  /* ---------- Toast ---------- */
  let toastEl = null, toastTimer = null;
  function toast(msg, { undo = false } = {}) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);
      toastEl.addEventListener("click", (e) => {
        if (e.target.closest("[data-undo]")) { const l = Core.undo(); toastEl.classList.remove("show"); if (l) setTimeout(() => toast("Undone"), 120); }
      });
    }
    toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" data-undo>Undo</button>` : ""}`;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), undo ? 5000 : 2600);
  }

  function confirmSheet({ title, text, ok = "OK", danger = false, onOk }) {
    const sh = sheet({ title, cls: "small", top: true });
    sh.body.innerHTML = `<p class="lead">${esc(text)}</p>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn ${danger ? "danger" : "primary"}" data-ok>${esc(ok)}</button></div>`;
    sh.body.querySelector("[data-ok]").addEventListener("click", () => { sh.close(); onOk(); });
  }

  /* ---------- Bits ---------- */
  /* Finish gets its own line (more prominent than the tags, less than the name) */
  const finishLine = (b) => b.finish
    ? `${esc(b.finish)} finish${b.finishMonths !== "" && b.finishMonths != null ? `<span class="b-fin-mo">, ${esc(b.finishMonths)} months</span>` : ""}`
    : "No finish";
  function tagsHtml(b, { proof = true, finish = true } = {}) {
    const t = [];
    if (b.base) t.push(`<span class="tag t-base">${esc(b.base)}</span>`);
    if (b.barrel) t.push(`<span class="tag t-barrel">Barrel ${esc(b.barrel)}</span>`);
    if (proof && b.abv !== "" && b.abv != null) t.push(`<span class="tag t-proof">${esc(b.abv)}% ABV</span>`);
    return `${finish ? `<div class="b-fin${b.finish ? "" : " none"}">${finishLine(b)}</div>` : ""}<div class="tags">${t.join("")}</div>`;
  }
  function placeHtml(locId, spotId) {
    const l = Core.loc(locId); const sp = Core.spot(locId, spotId);
    return `<span class="pl"><span class="pl-loc">${esc(l ? l.name : "Unknown")}</span>${sp ? `<span class="pl-spot">${esc(sp.name)}</span>` : ""}</span>`;
  }
  function bottleCard({ b, rows, total }, { showPlaces = true } = {}) {
    return `<div class="bcard" role="button" tabindex="0" data-open="${b.id}" aria-label="${esc(Core.fullName(b))}, ${total} on hand">
      <div class="bcard-top"><div class="bcard-name">${esc(b.name)}</div><div class="bcard-total"><b>${total}</b></div></div>
      ${tagsHtml(b)}
      ${showPlaces && rows.length ? `<ul class="bcard-places">${rows.map((r) => `<li>${placeHtml(r.locId, r.spotId)}<b>${r.count}</b></li>`).join("")}</ul>` : ""}
      ${showPlaces && !rows.length ? `<div class="bcard-empty">None on hand</div>` : ""}
    </div>`;
  }
  const stepperHtml = (n, { min = 0, max = 9999, label = "" } = {}) =>
    `<div class="stepper" data-min="${min}" data-max="${max}">
      <button type="button" data-step="-1" aria-label="One fewer${label ? " " + esc(label) : ""}">−</button>
      <input type="number" inputmode="numeric" min="${min}" max="${max}" value="${n}" aria-label="Quantity" />
      <button type="button" data-step="1" aria-label="One more${label ? " " + esc(label) : ""}">+</button>
    </div>`;
  function wireStepper(root, onChange) {
    root.addEventListener("click", (e) => {
      const b = e.target.closest(".stepper [data-step]"); if (!b) return;
      const st = b.closest(".stepper"); const inp = st.querySelector("input");
      const v = Math.min(+st.dataset.max, Math.max(+st.dataset.min, (parseInt(inp.value, 10) || 0) + +b.dataset.step));
      inp.value = v; onChange && onChange(v, st);
    });
    root.addEventListener("input", (e) => {
      const inp = e.target.closest(".stepper input"); if (!inp) return;
      const st = inp.closest(".stepper");
      onChange && onChange(Math.min(+st.dataset.max, Math.max(+st.dataset.min, parseInt(inp.value, 10) || 0)), st);
    });
  }

  /* place picker: pp = { locId, spotId } */
  function placePickerHtml(pp, { exclude } = {}) {
    const S = Core.state();
    const l = Core.loc(pp.locId);
    return `<div class="pp">
      <div class="chips" role="group" aria-label="Location">${S.locations.map((x) => `<button type="button" class="chip${x.id === pp.locId ? " on" : ""}" data-pp-loc="${x.id}" aria-pressed="${x.id === pp.locId}">${esc(x.name)}</button>`).join("")}</div>
      ${l ? `<div class="pp-spots"><div class="field-hint">Spot in ${esc(l.name)}</div><div class="chips" role="group" aria-label="Spot">
        <button type="button" class="chip${!pp.spotId ? " on" : ""}" data-pp-spot="" aria-pressed="${!pp.spotId}">No spot</button>
        ${l.spots.map((s) => {
          const same = exclude && exclude.locId === l.id && (exclude.spotId || "") === s.id;
          return `<button type="button" class="chip${s.id === pp.spotId ? " on" : ""}" data-pp-spot="${s.id}" aria-pressed="${s.id === pp.spotId}"${same ? " disabled" : ""}>${esc(s.name)}</button>`;
        }).join("")}
      </div>${l.spots.length ? "" : `<div class="field-hint">Add spots for ${esc(l.name)} in Settings.</div>`}</div>` : ""}
    </div>`;
  }
  function handlePlaceClick(e, pp) {
    const lb = e.target.closest("[data-pp-loc]");
    if (lb) { pp.locId = lb.dataset.ppLoc; pp.spotId = ""; return true; }
    const sb = e.target.closest("[data-pp-spot]");
    if (sb) { pp.spotId = sb.dataset.ppSpot; return true; }
    return false;
  }

  /* ---------- Bottle detail ---------- */
  function openBottle(id) {
    const sh = sheet({ cls: "bottle-sheet" });
    const off = Core.on(render); sh.onClose(off);
    function render() {
      const b = Core.bottle(id); if (!b) { sh.close(); return; }
      sh.setTitle(b.name);
      const rows = Core.stockFor(id); const total = Core.totalFor(id);
      sh.body.innerHTML = `
        <div class="bd-head">${tagsHtml(b)}<div class="bd-total"><b>${total}</b><span>on hand</span></div></div>
        ${b.barcode ? `<div class="bd-meta">Barcode ${esc(b.barcode)}</div>` : ""}
        ${b.notes ? `<div class="bd-notes">${esc(b.notes)}</div>` : ""}
        <h3 class="sec">Where it is</h3>
        ${rows.length ? `<ul class="where">${rows.map((r) => `
          <li class="where-row">
            <div class="where-place">${placeHtml(r.locId, r.spotId)}</div>
            <div class="where-ctrl">
              <button type="button" class="round" data-act="dec" data-row="${r.id}" aria-label="Remove one from ${esc(Core.placeName(r.locId, r.spotId))}">−</button>
              <span class="where-n">${r.count}</span>
              <button type="button" class="round" data-act="inc" data-row="${r.id}" aria-label="Add one at ${esc(Core.placeName(r.locId, r.spotId))}">+</button>
              <button type="button" class="btn small" data-act="move" data-row="${r.id}">Move</button>
            </div>
          </li>`).join("")}</ul>` : `<p class="muted">None on hand right now.</p>`}
        <button type="button" class="btn ghost wide" data-act="add-stock">Add bottles to a spot</button>
        <div class="bd-foot">
          <button type="button" class="link" data-act="edit">Edit details</button>
          <button type="button" class="link danger" data-act="delete">Delete bottle</button>
        </div>`;
    }
    sh.body.addEventListener("click", (e) => {
      const t = e.target.closest("[data-act]"); if (!t) return;
      const b = Core.bottle(id); if (!b) return;
      const row = t.dataset.row ? Core.state().stock.find((r) => r.id === t.dataset.row) : null;
      const act = t.dataset.act;
      if (act === "inc" || act === "dec") {
        const d = act === "inc" ? 1 : -1;
        Core.changeCount(id, row.locId, row.spotId, d);
        toast(`${d > 0 ? "+1" : "−1"} at ${Core.placeName(row.locId, row.spotId)}`, { undo: true });
      }
      if (act === "move") openMove(id, { locId: row.locId, spotId: row.spotId });
      if (act === "add-stock") openAddStock(id);
      if (act === "edit") openBottleForm({ id });
      if (act === "delete") confirmSheet({ title: "Delete this bottle?", text: `${Core.fullName(b)} and its ${Core.totalFor(id)} on-hand count will be removed. You can undo right after.`, ok: "Delete bottle", danger: true, onOk: () => { Core.deleteBottle(id); toast("Bottle deleted", { undo: true }); } });
    });
    render();
    return sh;
  }

  /* ---------- Move ---------- */
  function openMove(bottleId, from, { onDone } = {}) {
    const b = Core.bottle(bottleId); if (!b) return;
    const rows = Core.stockFor(bottleId);
    if (!rows.length) { toast("None on hand to move"); return; }
