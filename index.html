    let fromRow = from ? rows.find((r) => r.locId === from.locId && (r.spotId || "") === (from.spotId || "")) : (rows.length === 1 ? rows[0] : null);
    const pp = { locId: "", spotId: "" };
    let qty = 1;
    const sh = sheet({ title: `Move ${b.name}`, cls: "move-sheet" });
    function render() {
      const max = fromRow ? fromRow.count : 1;
      qty = Math.min(qty, max);
      const same = fromRow && pp.locId === fromRow.locId && (pp.spotId || "") === (fromRow.spotId || "");
      const ready = fromRow && pp.locId && !same;
      sh.body.innerHTML = `
        ${tagsHtml(b, { proof: false })}
        <h3 class="sec">From</h3>
        ${rows.length > 1 || !fromRow ? `<div class="chips col">${rows.map((r) => `<button type="button" class="chip place${fromRow && fromRow.id === r.id ? " on" : ""}" data-from="${r.id}">${placeHtml(r.locId, r.spotId)}<b>${r.count}</b></button>`).join("")}</div>`
          : `<div class="from-one">${placeHtml(fromRow.locId, fromRow.spotId)}<b>${fromRow.count} here</b></div>`}
        ${fromRow ? `<h3 class="sec">How many</h3><div class="qty-row">${stepperHtml(qty, { min: 1, max })}${max > 1 ? `<button type="button" class="btn small ghost" data-all>All ${max}</button>` : ""}</div>` : ""}
        <h3 class="sec">To</h3>
        <div class="pp-host">${placePickerHtml(pp, { exclude: fromRow })}</div>
        <div class="actions sticky"><button type="button" class="btn primary wide" data-go ${ready ? "" : "disabled"}>${ready ? `Move ${plural(qty, "bottle")} to ${esc(Core.placeName(pp.locId, pp.spotId))}` : same ? "Pick a different spot" : "Pick where they're going"}</button></div>`;
    }
    sh.body.addEventListener("click", (e) => {
      if (handlePlaceClick(e, pp)) return render();
      const fr = e.target.closest("[data-from]");
      if (fr) { fromRow = rows.find((r) => r.id === fr.dataset.from); qty = 1; return render(); }
      if (e.target.closest("[data-all]")) { qty = fromRow.count; return render(); }
      if (e.target.closest("[data-go]")) {
        const n = Core.move(bottleId, fromRow, pp, qty);
        if (n) { toast(`Moved ${n} to ${Core.placeName(pp.locId, pp.spotId)}`, { undo: true }); sh.close(); onDone && onDone(); }
      }
    });
    wireStepper(sh.body, (v) => { qty = v; const btn = $("[data-go]", sh.body); if (btn && !btn.disabled) btn.textContent = `Move ${plural(qty, "bottle")} to ${Core.placeName(pp.locId, pp.spotId)}`; });
    render();
    return sh;
  }

  /* ---------- Add stock to an existing bottle ---------- */
  function openAddStock(bottleId, place) {
    const b = Core.bottle(bottleId); if (!b) return;
    const pp = { locId: place ? place.locId : "", spotId: place ? place.spotId || "" : "" };
    let n = 1;
    const sh = sheet({ title: `Add ${b.name}`, cls: "small" });
    function render() {
      sh.body.innerHTML = `${tagsHtml(b, { proof: false })}
        <h3 class="sec">How many</h3>${stepperHtml(n, { min: 1 })}
        <h3 class="sec">Where</h3><div class="pp-host">${placePickerHtml(pp)}</div>
        <div class="actions sticky"><button type="button" class="btn primary wide" data-go ${pp.locId ? "" : "disabled"}>${pp.locId ? `Add ${plural(n, "bottle")} to ${esc(Core.placeName(pp.locId, pp.spotId))}` : "Pick where they are"}</button></div>`;
    }
    sh.body.addEventListener("click", (e) => {
      if (handlePlaceClick(e, pp)) return render();
      if (e.target.closest("[data-go]")) { Core.changeCount(bottleId, pp.locId, pp.spotId, n); toast(`Added ${n} to ${Core.placeName(pp.locId, pp.spotId)}`, { undo: true }); sh.close(); }
    });
    wireStepper(sh.body, (v) => { n = v; const btn = $("[data-go]", sh.body); if (btn && !btn.disabled) btn.textContent = `Add ${plural(n, "bottle")} to ${Core.placeName(pp.locId, pp.spotId)}`; });
    render();
  }

  /* ---------- New / edit bottle ---------- */
  function openBottleForm({ id, prefill = {}, place, onSaved } = {}) {
    const editing = id ? Core.bottle(id) : null;
    const f = editing ? { ...editing } : { name: "", type: "", finish: "", finishMonths: "", abv: "", base: "", barrel: "", barcode: "", notes: "", ...prefill };
    const pp = { locId: place ? place.locId : "", spotId: place ? place.spotId || "" : "" };
    let count = 1;
    const sh = sheet({ title: editing ? "Edit bottle" : "New bottle", cls: "form-sheet" });
    const names = [...new Set(Core.state().bottles.map((b) => b.name))].sort();
    const listChips = (key, opts, val) => opts.map((o) => `<button type="button" class="chip${Core.norm(o) === Core.norm(val) ? " on" : ""}" data-fill="${key}" data-val="${esc(o)}">${esc(o)}</button>`).join("");
    sh.body.innerHTML = `
      <form class="bform" novalidate>
        <label class="field"><span>Bottle name</span><input name="name" value="${esc(f.name)}" placeholder="e.g. Prisoner's Share" autocomplete="off" /></label>
        <div class="chips sugg" data-sugg></div>
        <div class="field"><span>Base (made from)</span><input type="hidden" name="base" value="${esc(f.base || "")}" /></div>
        <div class="chips" data-base role="group" aria-label="Base"></div>
        <label class="field"><span>Finish</span><input name="finish" value="${esc(f.finish)}" placeholder="Leave blank for no finish" autocomplete="off" /></label>
        <div class="chips" data-list="finish"></div>
        <div class="field-row">
          <label class="field"><span>Finish time (months)</span><input name="finishMonths" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(f.finishMonths)}" /></label>
          <label class="field"><span>ABV (%)</span><input name="abv" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="${esc(f.abv)}" /></label>
        </div>
        <div class="field-row">
          <label class="field"><span>Barrel number</span><input name="barrel" value="${esc(f.barrel)}" autocomplete="off" /></label>
          <label class="field"><span>Barcode</span><span class="with-btn"><input name="barcode" value="${esc(f.barcode)}" inputmode="numeric" autocomplete="off" /><button type="button" class="icon-btn" data-scan-code aria-label="Scan barcode">${ICON.scan}</button></span></label>
        </div>
        <label class="field"><span>Notes</span><textarea name="notes" rows="2">${esc(f.notes)}</textarea></label>
        ${editing ? "" : `<h3 class="sec">Where is it?</h3><div class="pp-host"></div><h3 class="sec">How many</h3>${stepperHtml(count, { min: 0 })}`}
        <p class="form-err" role="alert"></p>
        <div class="actions sticky"><button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary">${editing ? "Save changes" : "Add bottle"}</button></div>
      </form>`;
    const form = $("form", sh.body);
    const ppHost = $(".pp-host", sh.body);
    const renderPP = () => { if (ppHost) ppHost.innerHTML = placePickerHtml(pp); };
    renderPP();
    const sugg = $("[data-sugg]", sh.body);
    const renderSugg = () => {
      const q = Core.norm(form.name.value);
      const list = names.filter((n) => !q || (Core.norm(n).includes(q) && Core.norm(n) !== q)).slice(0, 6);
      sugg.innerHTML = list.map((n) => `<button type="button" class="chip soft" data-fill="name" data-val="${esc(n)}">${esc(n)}</button>`).join("");
    };
    renderSugg();
    form.name.addEventListener("input", renderSugg);
    const renderList = (k) => {
      const all = k === "type" ? Core.typesInUse() : k === "base" ? Core.basesInUse() : Core.finishesInUse();
      const val = form[k].value;
      const exact = all.some((x) => Core.norm(x) === Core.norm(val));
      const list = Core.rankList(all, exact ? "" : val, k, 8);
      if (exact && !list.some((x) => Core.norm(x) === Core.norm(val))) list.unshift(all.find((x) => Core.norm(x) === Core.norm(val)));
      const isNew = val.trim() && !exact && !list.length;
      $(`[data-list="${k}"]`, sh.body).innerHTML = (k === "finish" ? `<button type="button" class="chip${!val.trim() ? " on" : ""}" data-fill="finish" data-val="">No finish</button>` : "")
        + listChips(k, list, val)
        + (all.length > list.length ? `<button type="button" class="chip soft" data-more="${k}">All ${all.length}…</button>` : "")
        + (isNew ? `<span class="field-hint" style="width:100%;margin:2px 0 0">“${esc(val.trim())}” will be added as a new ${k}.</span>` : "");
    };
    ["finish"].forEach((k) => { renderList(k); form[k].addEventListener("input", () => renderList(k)); });
    const renderBase = () => {
      const v = form.base.value;
      const opts = Core.basesInUse();
      $("[data-base]", sh.body).innerHTML = opts.map((o) => `<button type="button" class="chip${o === v ? " on" : ""}" data-pickbase="${esc(o)}" aria-pressed="${o === v}">${esc(o)}</button>`).join("")
        + (v && !opts.includes(v) ? `<button type="button" class="chip on" data-pickbase="${esc(v)}">${esc(v)}</button>` : "");
    };
    renderBase();
    sh.body.addEventListener("click", (e) => {
      if (ppHost && handlePlaceClick(e, pp)) return renderPP();
      const fill = e.target.closest("[data-fill]");
      if (fill) {
        const k = fill.dataset.fill; form[k].value = fill.dataset.val;
        if (k === "name") {
          const like = Core.state().bottles.find((b) => b.name === fill.dataset.val);
          if (like && !form.base.value) { form.base.value = like.base || ""; renderBase(); }
          if (like && !form.abv.value) form.abv.value = like.abv;
          renderSugg();
        }
        form[k].dispatchEvent(new Event("input"));
        return;
      }
      const pb = e.target.closest("[data-pickbase]");
      if (pb) { form.base.value = form.base.value === pb.dataset.pickbase ? "" : pb.dataset.pickbase; return renderBase(); }
      const more = e.target.closest("[data-more]");
      if (more) {
        const k = more.dataset.more;
        const all = k === "type" ? Core.typesInUse() : k === "base" ? Core.basesInUse() : Core.finishesInUse();
        const use = Core.usage(k);
        return openListPicker({ title: k === "type" ? "Pick a type" : k === "base" ? "Pick a base" : "Pick a finish", single: true, noun: k === "type" ? "types" : k === "base" ? "bases" : "finishes", countLabel: "bottles",
          items: all.map((v) => ({ value: v, label: v, count: Math.floor(use.get(v) || 0) })), selected: [form[k].value],
          onDone: (sel) => { form[k].value = sel[0] || ""; form[k].dispatchEvent(new Event("input")); } });
      }
      if (e.target.closest("[data-scan-code]")) openScanner({ title: "Scan this bottle's barcode", onCode: (c) => { form.barcode.value = c; } });
    });
    if (!editing) wireStepper(sh.body, (v) => { count = v; });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const vals = Object.fromEntries(["name", "base", "finish", "finishMonths", "abv", "barrel", "barcode", "notes"].map((k) => [k, form[k].value]));
      const err = $(".form-err", sh.body);
      if (!vals.name.trim()) { err.textContent = "Give the bottle a name."; form.name.focus(); return; }
      if (editing) {
        const clash = Core.findSame(vals);
        if (clash && clash.id !== id) { err.textContent = "Another bottle already has this name, finish, finish time, barrel, ABV and barcode."; return; }
        Core.updateBottle(id, vals); toast("Changes saved", { undo: true }); sh.close(); onSaved && onSaved(id); return;
      }
      if (count > 0 && !pp.locId) { err.textContent = "Pick where these bottles are, or set the count to 0."; return; }
      const r = Core.addBottle(vals, pp.locId ? pp : null, count);
      toast(r.merged ? `Matched a bottle you already have. Added ${count}.` : "Bottle added", { undo: true });
      sh.close();
      onSaved && onSaved(r.id);
    });
    if (!editing && !f.name) setTimeout(() => form.name.focus(), 60);
    return sh;
  }

  /* ---------- Pick a bottle ---------- */
  function pickBottle({ title = "Pick a bottle", onPick, note = "", top = false }) {
    const sh = sheet({ title, top, cls: "pick-sheet" });
    sh.body.innerHTML = `${note ? `<p class="muted">${esc(note)}</p>` : ""}
      <div class="search-box"><input type="search" placeholder="Name, type, finish, barrel" aria-label="Search bottles" /></div>
      <div class="pick-list"></div>`;
    const inp = $("input", sh.body), list = $(".pick-list", sh.body);
    const render = () => {
      const res = Core.filterBottles({ q: inp.value, showEmpty: true }).slice(0, 60);
      list.innerHTML = res.length ? res.map(({ b, total }) => `<button type="button" class="pick-row" data-pick="${b.id}"><span><b>${esc(b.name)}</b>${tagsHtml(b, { proof: false })}</span><span class="pick-n">${total}</span></button>`).join("") : `<p class="muted">No bottles match.</p>`;
    };
    inp.addEventListener("input", render);
    list.addEventListener("click", (e) => { const p = e.target.closest("[data-pick]"); if (p) { sh.close(); onPick(p.dataset.pick); } });
    render();
    return sh;
  }

  /* ---------- Camera scanner ---------- */
  const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "codabar", "itf", "qr_code"];
  function openScanner({ onCode, continuous = false, title = "Scan a barcode", hint = "Hold the barcode inside the frame" }) {
    const wrap = document.createElement("div");
    wrap.className = "scanner";
    wrap.innerHTML = `
      <div class="scanner-head"><h2>${esc(title)}</h2><button type="button" class="sheet-x" data-x aria-label="Close scanner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="scanner-view"><video playsinline muted autoplay></video><div class="scanner-frame"></div></div>
      <p class="scanner-msg">${esc(hint)}</p>
      <form class="scanner-manual"><input inputmode="numeric" placeholder="Or type the barcode" aria-label="Barcode" autocomplete="off" /><button class="btn primary" type="submit">Look up</button></form>`;
    document.body.appendChild(wrap);
    document.documentElement.classList.add("locked");
    const video = $("video", wrap), msg = $(".scanner-msg", wrap);
    let stream = null, raf = null, zx = null, alive = true, last = { c: null, t: 0 }, paused = false;
    function stop() {
      alive = false;
      if (raf) cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (zx) { try { zx.stop(); } catch (e) {} }
    }
    function close() { stop(); wrap.remove(); if (!openSheets.length) document.documentElement.classList.remove("locked"); }
    function hit(code) {
      code = String(code || "").trim(); if (!code || paused) return;
      const now = Date.now();
      if (last.c === code && now - last.t < 1800) return;
      last = { c: code, t: now };
      beep();
      if (navigator.vibrate) navigator.vibrate(40);
      if (continuous) { msg.textContent = `Scanned ${code}`; wrap.classList.add("flash"); setTimeout(() => wrap.classList.remove("flash"), 300); onCode(code, ctl); }
      else { close(); onCode(code); }
    }
    const ctl = { close, pause() { paused = true; }, resume() { paused = false; }, say(t) { msg.textContent = t; } };
    $("[data-x]", wrap).addEventListener("click", close);
    $("form", wrap).addEventListener("submit", (e) => { e.preventDefault(); const i = $("input", wrap); const v = i.value; i.value = ""; last = { c: null, t: 0 }; hit(v); });
    const fail = () => { if (alive) { msg.textContent = "The camera isn't available. It needs camera permission and an https:// web address. You can type the barcode below."; wrap.classList.add("no-cam"); } };
    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail();
        if ("BarcodeDetector" in window) {
          const det = new window.BarcodeDetector({ formats: FORMATS });
          try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } }); }
          catch (e) { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
          if (!alive) return stop();
          video.srcObject = stream; await video.play().catch(() => {});
          const loop = () => {
            if (!alive) return;
            if (video.readyState < 2) { raf = requestAnimationFrame(loop); return; }
            det.detect(video).then((c) => { if (c && c.length) hit(c[0].rawValue); }).catch(() => {}).finally(() => { if (alive) raf = requestAnimationFrame(loop); });
          };
          raf = requestAnimationFrame(loop);
        } else if (typeof ZXingBrowser !== "undefined") {
          const reader = new ZXingBrowser.BrowserMultiFormatReader();
          zx = await reader.decodeFromConstraints({ video: { facingMode: "environment" } }, video, (r) => { if (r) hit(r.getText()); });
          if (!alive) stop();
        } else fail();
      } catch (e) { fail(); }
    })();
    return ctl;
  }
  function beep() {
    try {
      const C = window.AudioContext || window.webkitAudioContext; const ctx = new C();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.13);
    } catch (e) {}
  }

  /* ---------- Scan to find ---------- */
  function scanLookup(code) {
    const hits = Core.byBarcode(code);
    if (hits.length === 1) return openBottle(hits[0].id);
    const sh = sheet({ title: `Barcode ${code}` });
    if (hits.length) {
      const res = hits.map((b) => ({ b, rows: Core.stockFor(b.id), total: Core.totalFor(b.id) }));
      sh.body.innerHTML = `<p class="lead">This barcode is on ${hits.length} bottles. Pick the one you're holding.</p>
        <div class="card-list">${res.map((r) => bottleCard(r)).join("")}</div>
        <button type="button" class="btn ghost wide" data-new>Add another finish or barrel with this barcode</button>`;
      $("[data-new]", sh.body).addEventListener("click", () => {
        const b = hits[0]; sh.close();
        openBottleForm({ prefill: { barcode: code, name: b.name, base: b.base, abv: b.abv } });
      });
      sh.body.addEventListener("click", (e) => { if (e.target.closest("[data-open]")) sh.close(); });
    } else {
      sh.body.innerHTML = `<p class="lead">No bottle has this barcode yet.</p>
        <div class="actions col"><button type="button" class="btn primary wide" data-new>Add a new bottle</button>
        <button type="button" class="btn ghost wide" data-attach>Add this barcode to a bottle you have</button></div>`;
      $("[data-new]", sh.body).addEventListener("click", () => { sh.close(); openBottleForm({ prefill: { barcode: code } }); });
      $("[data-attach]", sh.body).addEventListener("click", () => {
        sh.close();
        pickBottle({ title: "Which bottle has this barcode?", onPick: (id) => {
          const b = Core.bottle(id); Core.updateBottle(id, { ...b, barcode: code }); toast(`Barcode added to ${b.name}`, { undo: true }); openBottle(id);
        } });
      });
    }
  }
  const scanToFind = () => openScanner({ title: "Scan to find a bottle", onCode: scanLookup });

  /* ---------- Count check ---------- */
  function openCountCheck(preset = {}) {
    const st = { step: "pick", locId: preset.locId || "", spotId: preset.spotId === undefined ? null : preset.spotId, rows: [] };
    const sh = sheet({ title: "Count check", cls: "full count-sheet" });
    const label = () => (st.spotId === null ? (Core.loc(st.locId) || {}).name : Core.placeName(st.locId, st.spotId));
    function begin() {
      st.rows = Core.rowsAt(st.locId, st.spotId === null ? undefined : st.spotId).map((r) => ({ bottleId: r.bottleId, locId: r.locId, spotId: r.spotId || "", expected: r.count, found: null }))
        .sort((a, b) => Core.placeName(a.locId, a.spotId).localeCompare(Core.placeName(b.locId, b.spotId)) || Core.bottle(a.bottleId).name.localeCompare(Core.bottle(b.bottleId).name));
      st.step = "list"; render();
    }
    function render() {
      const S = Core.state();
      if (st.step === "pick") {
        sh.setTitle("Count check");
        const l = Core.loc(st.locId);
        sh.body.innerHTML = `<p class="lead">Pick a location or one spot. You'll see what the app expects there, then confirm what's actually on the shelf.</p>
          <h3 class="sec">Location</h3>
          <div class="chips">${S.locations.map((x) => `<button type="button" class="chip${x.id === st.locId ? " on" : ""}" data-cl="${x.id}">${esc(x.name)} <small>${Core.totalAt(x.id)}</small></button>`).join("")}</div>
          ${l ? `<h3 class="sec">Spot</h3><div class="chips">
            <button type="button" class="chip${st.spotId === null ? " on" : ""}" data-cs="__all">All of ${esc(l.name)}</button>
            ${l.spots.map((s) => `<button type="button" class="chip${st.spotId === s.id ? " on" : ""}" data-cs="${s.id}">${esc(s.name)} <small>${Core.totalAt(l.id, s.id)}</small></button>`).join("")}
            ${Core.rowsAt(l.id, "").length ? `<button type="button" class="chip${st.spotId === "" ? " on" : ""}" data-cs="">No spot <small>${Core.totalAt(l.id, "")}</small></button>` : ""}
          </div>` : ""}
          <div class="actions sticky"><button type="button" class="btn primary wide" data-begin ${l ? "" : "disabled"}>${l ? `Start counting ${esc(label())}` : "Pick a location"}</button></div>`;
        return;
      }
      if (st.step === "list") {
        sh.setTitle(`Counting ${label()}`);
        const done = st.rows.filter((r) => r.found !== null).length;
        const off = st.rows.filter((r) => r.found !== null && r.found !== r.expected).length;
        sh.body.innerHTML = `
          <div class="cc-bar"><div class="cc-prog"><b>${done}</b> of ${st.rows.length} checked${off ? `, <span class="warn">${off} off</span>` : ""}</div>
            <div class="cc-tools"><button type="button" class="btn small" data-cc-scan>${ICON.scan} Scan</button><button type="button" class="btn small ghost" data-cc-add>Not listed?</button></div></div>
          <div class="cc-progress"><i style="width:${st.rows.length ? (done / st.rows.length) * 100 : 0}%"></i></div>
          ${st.rows.length ? `<ul class="cc-list">${st.rows.map((r, i) => {
            const b = Core.bottle(r.bottleId);
            const state = r.found === null ? "" : r.found === r.expected ? " ok" : " off";
            return `<li class="cc-row${state}">
              <div class="cc-info"><b>${esc(b.name)}</b>${tagsHtml(b, { proof: false })}${st.spotId === null ? `<div class="cc-where">${placeHtml(r.locId, r.spotId)}</div>` : ""}<div class="cc-exp">App says ${r.expected}</div></div>
              <div class="cc-ctrl">
                <button type="button" class="round" data-cc="${i}" data-d="-1" aria-label="Found one fewer">−</button>
                <span class="cc-n" aria-label="Found">${r.found === null ? "?" : r.found}</span>
                <button type="button" class="round" data-cc="${i}" data-d="1" aria-label="Found one more">+</button>
                <button type="button" class="round ok-btn${r.found === r.expected ? " on" : ""}" data-cc="${i}" data-d="ok" aria-label="Count is right">✓</button>
              </div></li>`;
          }).join("")}</ul>` : `<p class="muted">The app doesn't expect any bottles here. If you find some, tap "Not listed?".</p>`}
          <div class="actions sticky"><button type="button" class="btn ghost" data-cc-back>Change spot</button><button type="button" class="btn primary" data-cc-review>Review</button></div>`;
        return;
      }
      if (st.step === "review") {
        sh.setTitle(`Review ${label()}`);
        const fixes = st.rows.filter((r) => r.found !== null && r.found !== r.expected);
        const unchecked = st.rows.filter((r) => r.found === null).length;
        sh.body.innerHTML = `
          ${fixes.length ? `<p class="lead">${plural(fixes.length, "count")} to fix:</p>
            <ul class="fix-list">${fixes.map((r) => { const b = Core.bottle(r.bottleId); return `<li><span><b>${esc(b.name)}</b> <span class="muted">${esc([Core.finishText(b), b.base, b.barrel ? "Barrel " + b.barrel : ""].filter(Boolean).join(", "))}</span>${st.spotId === null ? `<br><small>${esc(Core.placeName(r.locId, r.spotId))}</small>` : ""}</span><span class="fix-n">${r.expected} → <b>${r.found}</b></span></li>`; }).join("")}</ul>`
            : `<p class="lead">Everything you checked matches.</p>`}
          ${unchecked ? `<p class="muted">${plural(unchecked, "bottle")} not checked. Those counts stay as they are.</p>` : ""}
          <div class="actions sticky"><button type="button" class="btn ghost" data-cc-list>Back to list</button><button type="button" class="btn primary" data-cc-apply>${fixes.length ? `Fix ${plural(fixes.length, "count")}` : "Finish"}</button></div>`;
      }
    }
    function bump(i, d) {
      const r = st.rows[i];
      if (d === "ok") r.found = r.expected;
      else if (r.found === null) r.found = Math.max(0, r.expected + +d);
      else r.found = Math.max(0, r.found + +d);
      render();
    }
    function addFound(bottleId, spotId) {
      const exist = st.rows.findIndex((r) => r.bottleId === bottleId && r.spotId === spotId);
      if (exist >= 0) { const r = st.rows[exist]; r.found = (r.found === null ? 0 : r.found) + 1; }
      else st.rows.push({ bottleId, locId: st.locId, spotId, expected: 0, found: 1 });
      render();
    }
    function onScan(code, ctl) {
      const idx = st.rows.map((r, i) => [r, i]).filter(([r]) => Core.norm(Core.bottle(r.bottleId).barcode) === Core.norm(code));
      const bump1 = (i) => { const r = st.rows[i]; r.found = (r.found === null ? 0 : r.found) + 1; render(); const b = Core.bottle(r.bottleId); ctl.say(`${b.name}, ${Core.finishText(b)}: ${r.found} counted`); };
      if (idx.length === 1) return bump1(idx[0][1]);
      if (idx.length > 1) {
        ctl.pause();
        const ch = sheet({ title: "Which one is it?", top: true, cls: "small" });
        ch.body.innerHTML = idx.map(([r, i]) => { const b = Core.bottle(r.bottleId); return `<button type="button" class="pick-row" data-i="${i}"><span><b>${esc(b.name)}</b>${tagsHtml(b, { proof: false })}</span></button>`; }).join("");
        ch.onClose(() => ctl.resume());
        ch.body.addEventListener("click", (e) => { const p = e.target.closest("[data-i]"); if (p) { ch.close(); bump1(+p.dataset.i); } });
        return;
      }
      const known = Core.byBarcode(code);
      if (known.length === 1) { addFound(known[0].id, st.spotId === null ? "" : st.spotId); ctl.say(`${known[0].name} wasn't expected here. Added as found.`); return; }
      ctl.say(known.length ? "That barcode fits several finishes. Close the scanner and use “Not listed?”." : `No bottle has barcode ${code}.`);
    }
    sh.body.addEventListener("click", (e) => {
      const t = e.target;
      const cl = t.closest("[data-cl]"); if (cl) { st.locId = cl.dataset.cl; st.spotId = null; return render(); }
      const cs = t.closest("[data-cs]"); if (cs) { st.spotId = cs.dataset.cs === "__all" ? null : cs.dataset.cs; return render(); }
      if (t.closest("[data-begin]")) return begin();
      const cc = t.closest("[data-cc]"); if (cc) return bump(+cc.dataset.cc, cc.dataset.d);
      if (t.closest("[data-cc-scan]")) return openScanner({ title: `Counting ${label()}`, continuous: true, hint: "Scan each bottle as you touch it", onCode: onScan });
      if (t.closest("[data-cc-add]")) return pickBottle({ title: "Which bottle did you find?", top: true, onPick: (id) => addFound(id, st.spotId === null ? "" : st.spotId) });
      if (t.closest("[data-cc-back]")) { st.step = "pick"; return render(); }
      if (t.closest("[data-cc-review]")) { st.step = "review"; return render(); }
      if (t.closest("[data-cc-list]")) { st.step = "list"; return render(); }
      if (t.closest("[data-cc-apply]")) {
        const n = Core.applyCountCheck(label(), st.rows);
        toast(n ? `Fixed ${plural(n, "count")}` : "Count check saved", { undo: !!n });
        sh.close();
      }
    });
    if (st.locId && preset.start) begin(); else render();
    return sh;
  }

  /* ---------- Import / export ---------- */
  function doExport() {
    try { Core.exportXlsx(); toast("Exported to Excel"); } catch (e) { toast(e.message); }
  }
  function startImport() {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".xlsx,.xls,.csv"; inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", async () => {
      const file = inp.files[0]; inp.remove(); if (!file) return;
      let rows;
      try { rows = await Core.parseFile(file); }
      catch (e) { toast(e.message && e.message.includes("Excel tool") ? e.message : "That file couldn't be read. Use .xlsx, .xls or .csv."); return; }
      if (!rows.length) { toast("That sheet has no rows."); return; }
      const plan = Core.planImport(rows);
      if (!plan.merged.length && !plan.created.length) {
        const sh = sheet({ title: "Nothing to import", cls: "small" });
        sh.body.innerHTML = `<p class="lead">No rows could be used. The sheet needs a Name or Barcode column, plus Count and Location.</p>${plan.skipped.length ? `<ul class="imp-list">${plan.skipped.slice(0, 8).map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}<div class="actions"><button class="btn primary wide" data-close>OK</button></div>`;
        return;
      }
      const sh = sheet({ title: "Import preview", cls: "small" });
      const sect = (label, list) => (list.length ? `<details><summary>${esc(label)} (${list.length})</summary><ul class="imp-list">${list.slice(0, 200).map((s) => `<li>${esc(s)}</li>`).join("")}</ul></details>` : "");
      sh.body.innerHTML = `<p class="muted imp-file">${esc(file.name)}</p>
        <div class="imp-stats">
          <div><b>${plan.merged.length}</b><span>added to bottles you have</span></div>
          <div><b>${plan.newCount}</b><span>${plan.newCount === 1 ? "new bottle" : "new bottles"}</span></div>
          ${plan.skipped.length ? `<div><b>${plan.skipped.length}</b><span>skipped</span></div>` : ""}
        </div>
        <p class="muted">Counts are added to what's already here.</p>
        ${sect("Added to existing", plan.merged)}${sect("New bottles, by spot", plan.created)}${sect("Skipped", plan.skipped)}
        <div class="actions sticky"><button type="button" class="btn ghost" data-close>Cancel</button><button type="button" class="btn primary" data-apply>Import</button></div>`;
      $("[data-apply]", sh.body).addEventListener("click", () => { Core.applyImport(plan, file.name); sh.close(); toast(`Imported ${file.name}`, { undo: true }); });
    });
    inp.click();
  }
  function backupBannerHtml() {
    const s = Core.backupStatus();
    if (!Core.isStorageOk()) return `<div class="banner bad">Changes aren't saving on this device. Storage may be full or blocked.</div>`;
    if (!s.due) return "";
    return `<div class="banner"><span>${s.never ? "Your inventory hasn't been backed up yet." : `Last Excel backup was ${plural(s.days, "day")} ago.`}</span><button type="button" class="btn small" data-act="backup-now">Export now</button></div>`;
  }

  /* ---------- Filter sheet ---------- */
  function openFilterSheet(filters, onApply) {
    const f = { types: [...(filters.types || [])], finishes: [...(filters.finishes || [])], locs: [...(filters.locs || [])] };
    const sh = sheet({ title: "Filter bottles", cls: "filter-sheet" });
    const chip = (group, val, label) => `<button type="button" class="chip${f[group].includes(val) ? " on" : ""}" data-g="${group}" data-v="${esc(val)}" aria-pressed="${f[group].includes(val)}">${esc(label)}</button>`;
    const topChips = (group, field) => {
      const counts = Core.facetCounts(field, { ...filters, ...f });
      const ranked = [...counts.entries()].filter(([v, n]) => n > 0).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([v]) => v);
      const show = [...new Set([...f[group], ...ranked.slice(0, 10)])];
      return show.map((v) => chip(group, v, v || "No finish")).join("") + (ranked.length > show.length ? `<button type="button" class="chip soft" data-all="${group}">All ${ranked.length}…</button>` : "");
    };
    function render() {
      const n = Core.filterBottles({ ...filters, ...f }).length;
      sh.body.innerHTML = `
        <h3 class="sec">Type</h3><div class="chips">${topChips("types", "type")}</div>
        <h3 class="sec">Finish</h3><div class="chips">${topChips("finishes", "finish")}</div>
        <h3 class="sec">Location</h3><div class="chips">${Core.state().locations.map((l) => chip("locs", l.id, l.name)).join("")}</div>
        <div class="actions sticky"><button type="button" class="btn ghost" data-clear>Clear</button><button type="button" class="btn primary" data-apply>Show ${plural(n, "bottle")}</button></div>`;
    }
    sh.body.addEventListener("click", (e) => {
      const c = e.target.closest("[data-g]");
      if (c) { const a = f[c.dataset.g]; const v = c.dataset.v; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); return render(); }
      if (e.target.closest("[data-clear]")) { f.types = []; f.finishes = []; f.locs = []; return render(); }
      if (e.target.closest("[data-apply]")) { onApply(f); sh.close(); }
      const all = e.target.closest("[data-all]");
      if (all) {
        const g = all.dataset.all, field = g === "types" ? "type" : "finish";
        const counts = Core.facetCounts(field, { ...filters, ...f });
        const vals = field === "type" ? Core.typesInUse() : ["", ...Core.finishesInUse()];
        openListPicker({ title: field === "type" ? "Types" : "Finishes", noun: g, items: vals.map((v) => ({ value: v, label: v || "No finish", count: counts.get(v) || 0 })), selected: f[g], onDone: (sel) => { f[g] = sel; render(); } });
      }
    });
    render();
  }


  /* ---------- Long-list picker (types / finishes) ---------- */
  function openListPicker({ title, items, selected = [], onDone, single = false, noun = "items", countLabel = "on hand", allowZero = true }) {
    const sel = new Set(selected.filter((x) => x !== undefined && x !== null));
    let q = "", sort = "count", showZero = false;
    const sh = sheet({ title, top: true, cls: "picker-sheet" });
    sh.body.innerHTML = `<div class="search-box picker-search"><input type="search" placeholder="Type to narrow ${esc(noun)}" aria-label="Search ${esc(noun)}" autocomplete="off" /></div>
      <div class="picker-tools"><span class="picker-n"></span><span><button type="button" class="link" data-sort>A–Z</button></span></div>
      <div class="picker-sel chips"></div>
      <ul class="picker-list"></ul>
      ${single ? "" : `<div class="actions sticky"><button type="button" class="btn ghost" data-clear>Clear</button><button type="button" class="btn primary" data-done>Done</button></div>`}`;
    const inp = $("input", sh.body), list = $(".picker-list", sh.body);
    function render() {
      const n = Core.norm(q);
      let rows = items.filter((it) => !n || Core.norm(it.label).includes(n));
      const hidden = rows.filter((it) => !it.count && !sel.has(it.value)).length;
      if (!showZero && !n) rows = rows.filter((it) => it.count || sel.has(it.value));
      rows.sort((a, b) => (n ? Core.norm(b.label).startsWith(n) - Core.norm(a.label).startsWith(n) : 0) || (sort === "count" ? b.count - a.count : 0) || a.label.localeCompare(b.label));
      $(".picker-n", sh.body).textContent = `${rows.length} of ${items.length} ${noun}`;
      $("[data-sort]", sh.body).textContent = sort === "count" ? "Sort A–Z" : "Sort by most";
      $(".picker-sel", sh.body).innerHTML = single ? "" : [...sel].map((v) => { const it = items.find((x) => x.value === v); return `<button type="button" class="chip on" data-pv="${esc(v)}">${esc(it ? it.label : v || "No finish")} ×</button>`; }).join("");
      list.innerHTML = rows.slice(0, 300).map((it) => `<li><button type="button" class="picker-row${sel.has(it.value) ? " on" : ""}" data-pv="${esc(it.value)}" aria-pressed="${sel.has(it.value)}">
          <span class="picker-check" aria-hidden="true">${sel.has(it.value) ? "✓" : ""}</span><span class="picker-label">${esc(it.label)}</span><span class="picker-count">${it.count || ""}</span></button></li>`).join("")
        + (!n && !showZero && hidden && allowZero ? `<li><button type="button" class="link" data-zero>Show ${hidden} with none on hand</button></li>` : "")
        + (!rows.length ? `<li class="muted" style="padding:12px 0">No ${esc(noun)} match “${esc(q)}”.</li>` : "");
    }
    inp.addEventListener("input", () => { q = inp.value; render(); });
    sh.body.addEventListener("click", (e) => {
      const p = e.target.closest("[data-pv]");
      if (p) {
        const v = p.dataset.pv;
        if (single) { sh.close(); onDone([v]); return; }
        sel.has(v) ? sel.delete(v) : sel.add(v);
        return render();
      }
      if (e.target.closest("[data-sort]")) { sort = sort === "count" ? "az" : "count"; return render(); }
      if (e.target.closest("[data-zero]")) { showZero = true; return render(); }
      if (e.target.closest("[data-clear]")) { sel.clear(); return render(); }
      if (e.target.closest("[data-done]")) { sh.close(); onDone([...sel]); }
    });
    render();
    setTimeout(() => inp.focus(), 80);
    return sh;
  }

  /* ---------- Settings ---------- */
  function mountSettings(root, { extra = "" } = {}) {
    let editing = null; // "loc:<id>" | "spot:<loc>:<id>"
    const listQ = { types: "", finishes: "" }, listAll = { types: false, finishes: false };
    const listHtml = (k) => {
      const S = Core.state(); const n = Core.norm(listQ[k]);
      const vals = [...S[k]].sort((a, b) => a.localeCompare(b)).filter((v) => !n || Core.norm(v).includes(n));
      const cap = n || listAll[k] ? vals.length : 30;
      return vals.slice(0, cap).map((v) => `<span class="chip removable">${esc(v)}<button type="button" data-s="rm-${k}" data-v="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></span>`).join("")
        + (vals.length > cap ? `<button type="button" class="chip soft" data-s="all-${k}">Show all ${vals.length}</button>` : "")
        + (n && !vals.length ? `<span class="muted">None match.</span>` : "");
    };
    function render() {
      const S = Core.state();
      const bs = Core.backupStatus();
      root.innerHTML = `<div class="settings">
        ${S.demo ? `<section class="set-card demo"><h3>You're looking at sample bottles</h3><p class="muted">Try anything. When you're ready, clear them and keep your 4 locations.</p><button type="button" class="btn" data-s="clear-sample">Clear sample bottles</button></section>` : ""}
        <section class="set-card"><h3>Excel</h3>
          <p class="muted">${bs.never ? "Never exported." : `Last export ${bs.days === 0 ? "today" : plural(bs.days, "day") + " ago"}.`} Your inventory lives only on this phone, so export regularly.</p>
          <div class="actions"><button type="button" class="btn primary" data-s="export">Export to Excel</button><button type="button" class="btn ghost" data-s="import">Import Excel</button></div>
          <p class="field-hint">Importing adds to matching bottles: same name, finish, finish time, barrel and ABV, in the same spot. 2 here + 4 in the sheet = 6.</p>
        </section>
        <section class="set-card"><h3>Locations and spots</h3>
          ${S.locations.map((l, li) => `<div class="loc-block">
            <div class="loc-line">
              ${editing === "loc:" + l.id ? `<form class="inline-edit" data-form="loc" data-id="${l.id}"><input value="${esc(l.name)}" aria-label="Location name" /><button class="btn small primary">Save</button></form>`
                : `<b>${esc(l.name)}</b><span class="muted">${Core.totalAt(l.id)} bottles</span>
                <span class="loc-tools">
                  <button type="button" class="icon-btn" data-s="up" data-id="${l.id}" aria-label="Move ${esc(l.name)} up" ${li === 0 ? "disabled" : ""}>↑</button>
                  <button type="button" class="icon-btn" data-s="down" data-id="${l.id}" aria-label="Move ${esc(l.name)} down" ${li === S.locations.length - 1 ? "disabled" : ""}>↓</button>
                  <button type="button" class="link" data-s="edit-loc" data-id="${l.id}">Rename</button>
                  <button type="button" class="link danger" data-s="rm-loc" data-id="${l.id}">Remove</button></span>`}
            </div>
            <ul class="spot-list">${l.spots.map((s) => `<li>${editing === `spot:${l.id}:${s.id}` ? `<form class="inline-edit" data-form="spot" data-loc="${l.id}" data-id="${s.id}"><input value="${esc(s.name)}" aria-label="Spot name" /><button class="btn small primary">Save</button></form>`
              : `<span>${esc(s.name)} <span class="muted">${Core.totalAt(l.id, s.id)}</span></span><span><button type="button" class="link" data-s="edit-spot" data-loc="${l.id}" data-id="${s.id}">Rename</button><button type="button" class="link danger" data-s="rm-spot" data-loc="${l.id}" data-id="${s.id}">Remove</button></span>`}</li>`).join("")}</ul>
            <form class="add-line" data-form="add-spot" data-loc="${l.id}"><input placeholder="Add a spot in ${esc(l.name)}" aria-label="New spot in ${esc(l.name)}" /><button class="btn small">Add</button></form>
          </div>`).join("")}
          <form class="add-line" data-form="add-loc"><input placeholder="Add a location" aria-label="New location" /><button class="btn small">Add</button></form>
        </section>
        ${["types", "finishes"].map((k) => `<section class="set-card"><h3>${k === "types" ? "Whiskey types" : "Finishes"} <span class="muted" style="font-size:14px">${S[k].length}</span></h3>
          ${S[k].length > 20 ? `<div class="search-box"><input type="search" data-listq="${k}" value="${esc(listQ[k])}" placeholder="Find a ${k === "types" ? "type" : "finish"}" aria-label="Find in ${k}" /></div>` : ""}
          <div class="chips" data-listbox="${k}">${listHtml(k)}</div>
          <form class="add-line" data-form="add-${k}"><input placeholder="Add a ${k === "types" ? "type" : "finish"}" /><button class="btn small">Add</button></form></section>`).join("")}
        ${extra}
        <section class="set-card"><h3>Start over</h3><p class="muted">Erase every bottle, spot and history entry on this phone. Export first if you might want it back.</p><button type="button" class="btn danger" data-s="erase">Erase everything</button></section>
      </div>`;
      const inp = root.querySelector(".inline-edit input"); if (inp) { inp.focus(); inp.select(); }
    }
    root.addEventListener("click", (e) => {
      const t = e.target.closest("[data-s]"); if (!t) return;
      const a = t.dataset.s, id = t.dataset.id, lid = t.dataset.loc;
      if (a === "export") doExport();
      if (a === "import") startImport();
      if (a === "clear-sample") confirmSheet({ title: "Clear sample bottles?", text: "All sample bottles, spots and counts will be removed. Landing, Chapel, Office and Library stay.", ok: "Clear them", danger: true, onOk: () => { Core.clearSample(); toast("Sample bottles cleared"); } });
      if (a === "up" || a === "down") Core.moveLocation(id, a === "up" ? -1 : 1);
      if (a === "edit-loc") { editing = "loc:" + id; render(); }
      if (a === "edit-spot") { editing = `spot:${lid}:${id}`; render(); }
      if (a === "rm-loc") { const r = Core.removeLocation(id); if (r === "not-empty") toast("Move or remove its bottles first"); else toast("Location removed", { undo: true }); }
      if (a === "rm-spot") {
        const n = Core.totalAt(lid, id); const l = Core.loc(lid);
        const go = () => { Core.removeSpot(lid, id); toast("Spot removed", { undo: true }); };
        if (n) confirmSheet({ title: "Remove this spot?", text: `${Core.placeName(lid, id)} has ${plural(n, "bottle")}. They'll stay in ${l.name} with no spot.`, ok: "Remove spot", danger: true, onOk: go }); else go();
      }
      if (a === "rm-types" || a === "rm-finishes") Core.removeListItem(a.slice(3), t.dataset.v);
      if (a === "all-types" || a === "all-finishes") { const k = a.slice(4); listAll[k] = true; root.querySelector(`[data-listbox="${k}"]`).innerHTML = listHtml(k); }
      if (a === "erase") confirmSheet({ title: "Erase everything?", text: "This removes every bottle, count, spot and history entry on this phone. It can't be undone.", ok: "Erase everything", danger: true, onOk: () => { Core.eraseAll(); toast("Everything erased"); } });
    });
    root.addEventListener("input", (e) => {
      const li = e.target.closest("[data-listq]"); if (!li) return;
      const k = li.dataset.listq; listQ[k] = li.value; root.querySelector(`[data-listbox="${k}"]`).innerHTML = listHtml(k);
    });
    root.addEventListener("submit", (e) => {
      const fm = e.target.closest("[data-form]"); if (!fm) return; e.preventDefault();
      const v = fm.querySelector("input").value; const k = fm.dataset.form;
      let r;
      if (k === "loc") { editing = null; Core.renameLocation(fm.dataset.id, v); render(); }
      if (k === "spot") { editing = null; Core.renameSpot(fm.dataset.loc, fm.dataset.id, v); render(); }
      if (k === "add-spot") r = Core.addSpot(fm.dataset.loc, v);
      if (k === "add-loc") r = Core.addLocation(v);
      if (k === "add-types") r = Core.addListItem("types", v);
      if (k === "add-finishes") r = Core.addListItem("finishes", v);
      if (r === "exists") toast("That's already on the list");
    });
    const off = Core.on(render);
    render();
    return off;
  }

  /* ---------- History ---------- */
  function mountHistory(root) {
    let q = "";
    root.innerHTML = `<div class="history"><div class="search-box"><input type="search" placeholder="Search history" aria-label="Search history" /></div><div class="hist-body"></div></div>`;
    const body = root.querySelector(".hist-body");
    function render() {
      const list = Core.state().history.filter((h) => !q || Core.norm(h.text).includes(Core.norm(q)));
      if (!list.length) { body.innerHTML = `<p class="muted">${q ? "Nothing matches." : "Changes you make will show up here."}</p>`; return; }
      let day = "", out = "";
      for (const h of list.slice(0, 400)) {
        const d = new Date(h.t);
        const dl = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
        if (dl !== day) { if (day) out += "</ul>"; out += `<h3 class="hist-day">${esc(dl)}</h3><ul class="hist-list">`; day = dl; }
        out += `<li><time>${d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</time><span>${esc(h.text)}</span></li>`;
      }
      body.innerHTML = out + "</ul>" + (Core.canUndo() ? `<button type="button" class="btn ghost wide" data-hundo>Undo: ${esc(Core.lastUndoLabel())}</button>` : "");
    }
    root.querySelector("input").addEventListener("input", (e) => { q = e.target.value; render(); });
    root.addEventListener("click", (e) => { if (e.target.closest("[data-hundo]")) { Core.undo(); toast("Undone"); } });
    const off = Core.on(render);
    render();
    return off;
  }

  const ICON = {
    scan: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>`,
    search: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
    move: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg>`,
    plus: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
    check: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
    filter: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`,
    history: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>`,
    gear: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>`,
    building: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M12 3v18M3 12h18"/></svg>`,
    back: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>`,
  };

  function registerSW() {
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  }

  return {
    esc, plural, sheet, toast, confirmSheet, tagsHtml, placeHtml, bottleCard, stepperHtml, wireStepper,
    openBottle, openMove, openAddStock, openBottleForm, pickBottle, openScanner, scanLookup, scanToFind,
    openCountCheck, openListPicker, doExport, startImport, backupBannerHtml, openFilterSheet, mountSettings, mountHistory, ICON, registerSW,
  };
})();

</script>
<script>
(function () {
  "use strict";
  const { esc, plural, ICON } = UI;
  const top = document.getElementById("top");
  const main = document.getElementById("main");
  const tabsEl = document.getElementById("tabs");
  const fab = document.getElementById("fab");
  const CHEV = `<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`;
  const PENCIL = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const TABS = [
    { id: "find", label: "Find", icon: ICON.search },
    { id: "count", label: "Count", icon: ICON.check },
    { id: "history", label: "History", icon: ICON.history },
    { id: "settings", label: "Settings", icon: ICON.gear },
  ];
  const RAIL_MAX = 8;
  let tab = "find", setPage = "menu", unmount = null;
  const f = { q: "", names: [], bases: [], finishes: [], locs: [], spots: [], barrel: "" };

  fab.innerHTML = `${ICON.plus}<span>New bottle</span>`;
  fab.addEventListener("click", () => UI.openBottleForm());

  function header(title, { back = false, sum = false } = {}) {
    top.innerHTML = `<div class="top-left">${back ? `<button type="button" class="back" data-back aria-label="Back to Settings">${ICON.back}</button>` : ""}<h1>${esc(title)}</h1></div>${sum ? `<div class="sum"><b>${Core.totalAll()}</b>on hand</div>` : ""}`;
  }
  top.addEventListener("click", (e) => { if (e.target.closest("[data-back]")) { setPage = "menu"; go("settings"); } });

  function renderTabs() {
    tabsEl.innerHTML = TABS.map((t) => `<button type="button" class="tab" data-tab="${t.id}" ${t.id === tab ? 'aria-current="page"' : ""}>${t.icon}<span>${t.label}</span></button>`).join("");
  }
  tabsEl.addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; if (b.dataset.tab === "settings") setPage = "menu"; go(b.dataset.tab); });

  function go(next) {
    tab = next;
    if (unmount) { unmount(); unmount = null; }
    renderTabs();
    fab.style.display = tab === "find" ? "" : "none";
    main.innerHTML = "";
    const host = document.createElement("div");
    main.appendChild(host);
    window.scrollTo(0, 0);
    if (tab === "find") mountFind(host);
    if (tab === "count") mountCount(host);
    if (tab === "history") { header("History"); unmount = UI.mountHistory(host); }
    if (tab === "settings") mountSettings(host);
  }

  /* ================= Find ================= */
  function mountFind(host) {
    host.innerHTML = `<div id="banner"></div>
      <div class="finder">
        <div class="strip">
          ${ICON.search}
          <input id="q" type="search" placeholder="Bottle, finish, barrel, cabinet…" value="${esc(f.q)}" autocomplete="off" enterkeyhint="search" aria-label="Search bottles" aria-controls="sg" />
          <button type="button" class="clear-q" id="clearQ" aria-label="Clear search" ${f.q ? "" : "hidden"}>×</button>
          <button type="button" class="scan-btn" id="scanBtn">${ICON.scan}<span>Scan</span></button>
        </div>
        <div class="sg-box" id="sg" role="listbox"></div>
      </div>
      <div class="rails" id="rails"></div>
      <div class="active-row" id="active"></div>
      <div id="map"></div>
      <div class="result-line" id="resLine"></div>
      <div class="card-list" id="results"></div>`;
    const q = host.querySelector("#q"), sg = host.querySelector("#sg"), clearQ = host.querySelector("#clearQ");
    const setQ = (v) => { f.q = v; q.value = v; clearQ.hidden = !v; };

    function renderSugg() {
      const list = document.activeElement === q ? Core.suggest(f.q, { ...f, q: "" }) : [];
      if (!list.length) { sg.innerHTML = ""; return; }
      const n = Core.norm(f.q);
      const hl = (s) => { const i = Core.norm(s).indexOf(n); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + n.length)) + "</mark>" + esc(s.slice(i + n.length)); };
      const KIND = { finish: "Finish", name: "Bottle", base: "Base", loc: "Location", spot: "Spot", barrel: "Barrel" };
      sg.innerHTML = list.map((s) => `<button type="button" class="sg-row" role="option" data-sk="${s.kind}" data-sv="${esc(s.value)}"><span class="kind">${KIND[s.kind]}</span><span class="lbl">${hl(s.label)}</span><span class="cnt">${s.count}</span></button>`).join("")
        + `<div class="sg-hint">Tap one to filter by it, or keep typing to search everything.</div>`;
    }
    function applySugg(kind, value) {
      const add = (arr) => { if (!arr.includes(value)) arr.push(value); };
      if (kind === "finish") add(f.finishes);
      if (kind === "name") add(f.names);
      if (kind === "base") add(f.bases);
      if (kind === "loc") add(f.locs);
      if (kind === "spot") add(f.spots);
      if (kind === "barrel") f.barrel = value;
      setQ(""); q.blur(); sg.innerHTML = ""; draw();
    }
    q.addEventListener("input", () => { setQ(q.value); renderSugg(); renderRest(); });
    q.addEventListener("focus", renderSugg);
    q.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== q && !sg.contains(document.activeElement)) sg.innerHTML = ""; }, 150));
    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); q.blur(); sg.innerHTML = ""; }
      if (e.key === "ArrowDown") { const first = sg.querySelector(".sg-row"); if (first) { e.preventDefault(); first.focus(); } }
    });
    sg.addEventListener("pointerdown", (e) => { if (e.target.closest(".sg-row")) e.preventDefault(); });
    sg.addEventListener("click", (e) => { const s = e.target.closest(".sg-row"); if (s) applySugg(s.dataset.sk, s.dataset.sv); });
    clearQ.addEventListener("click", () => { setQ(""); sg.innerHTML = ""; renderRest(); q.focus(); });
    host.querySelector("#scanBtn").addEventListener("click", UI.scanToFind);

    host.addEventListener("click", (e) => {
      const c = e.target.closest("[data-g]");
      if (c) { const a = f[c.dataset.g]; const i = a.indexOf(c.dataset.v); i >= 0 ? a.splice(i, 1) : a.push(c.dataset.v); return draw(); }
      const all = e.target.closest("[data-all]"); if (all) return openAll(all.dataset.all);
      const sp = e.target.closest("[data-spot]"); if (sp) return openSpot(sp.dataset.loc, sp.dataset.spot);
      const dr = e.target.closest("[data-dimroom]"); if (dr) return openSpot(dr.dataset.dimroom, null);
      const rm = e.target.closest("[data-rm]");
      if (rm) { const k = rm.dataset.rm; if (k === "barrel") f.barrel = ""; else f[k].splice(f[k].indexOf(rm.dataset.v), 1); return draw(); }
      if (e.target.closest("[data-clear-all]")) { setQ(""); f.names = []; f.bases = []; f.finishes = []; f.locs = []; f.spots = []; f.barrel = ""; return draw(); }
      if (e.target.closest("[data-first]")) UI.openBottleForm();
    });

    function openAll(group) {
      const field = group === "names" ? "name" : group === "bases" ? "base" : "finish";
      const counts = Core.facetCounts(field, f);
      const vals = field === "name" ? Core.namesInUse() : field === "base" ? Core.basesInUse() : ["", ...Core.finishesInUse()];
      UI.openListPicker({ title: field === "name" ? "Bottles" : field === "base" ? "Bases" : "Finishes", noun: field === "name" ? "bottles" : group,
        items: vals.map((v) => ({ value: v, label: v || "No finish", count: counts.get(v) || 0 })),
        selected: f[group], onDone: (sel) => { f[group] = sel; draw(); } });
    }

    function railChips(group, field) {
      const counts = Core.facetCounts(field, f);
      const ranked = [...counts.entries()].filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const sel = f[group];
      const topList = ranked.filter(([v]) => !sel.includes(v)).slice(0, Math.max(0, RAIL_MAX - sel.length));
      const chip = (v, n, on) => `<button type="button" class="chip${on ? " on" : ""}" data-g="${group}" data-v="${esc(v)}" aria-pressed="${on}">${esc(v || (field === "finish" ? "No finish" : "Not set"))} <small>${n}</small></button>`;
      const total = field === "name" ? Core.namesInUse().length : field === "base" ? Core.basesInUse().length : Core.finishesInUse().length;
      return sel.map((v) => chip(v, counts.get(v) || 0, true)).join("") + topList.map(([v, n]) => chip(v, n, false)).join("")
        + (ranked.length > sel.length + topList.length || total > RAIL_MAX ? `<button type="button" class="chip all" data-all="${group}">All ${total}…</button>` : "");
    }

    function mapHtml() {
      const S = Core.state();
      const active = Core.filterActive(f);
      const sc = Core.spotCounts(f);
      const lit = [], dim = [];
      S.locations.forEach((l) => {
        const keys = [...l.spots.map((s) => l.id + "|" + s.id), l.id + "|"];
        const n = keys.reduce((m, k) => m + (sc.get(k) || 0), 0);
        (active && !n ? dim : lit).push({ l, n });
      });
      const room = ({ l, n }) => {
        const loose = sc.get(l.id + "|") || 0;
        const looseAll = Core.totalAt(l.id, "");
        const boxes = l.spots.map((s) => {
          const c = sc.get(l.id + "|" + s.id) || 0;
          return `<button type="button" class="spot${c ? " has lit" : ""}" data-loc="${l.id}" data-spot="${s.id}" aria-label="${esc(l.name)}, ${esc(s.name)}: ${c}${active ? " matching" : ""}"><span class="sn">${esc(s.name)}</span><span class="sc">${c}</span></button>`;
        }).join("") + (looseAll || loose ? `<button type="button" class="spot loose${loose ? " has lit" : ""}" data-loc="${l.id}" data-spot="" aria-label="${esc(l.name)}, no spot: ${loose}"><span class="sn">No spot</span><span class="sc">${loose}</span></button>` : "");
        return `<section class="room" aria-label="${esc(l.name)}"><div class="room-h"><b>${esc(l.name)}</b><span>${n}${active ? `<small>of ${Core.totalAt(l.id)}</small>` : ""}</span></div>
          ${boxes ? `<div class="spots">${boxes}</div>` : `<div class="room-empty">No spots yet. Add them in Settings › Locations and spots.</div>`}</section>`;
      };
      if (!active) {
        return `<div class="loc-strip" role="group" aria-label="Locations">${S.locations.map((l) => `<button type="button" class="loc-pill" data-dimroom="${l.id}">${esc(l.name)} <b>${Core.totalAt(l.id)}</b></button>`).join("")}</div>`;
      }
      return `<div class="map-h"><h2>Where</h2><span>Lit spots have a match</span></div>
        <div class="map${active ? " filtering" : ""}">${lit.map(room).join("")}</div>
        ${dim.length ? `<div class="dim-rooms"><span class="lbl">No matches in</span>${dim.map(({ l }) => `<button type="button" class="dim-room" data-dimroom="${l.id}">${esc(l.name)}</button>`).join("")}</div>` : ""}
        ${active && !lit.length ? `<p class="muted">Nothing matches anywhere in the building.</p>` : ""}`;
    }

    function renderRest() {
      document.getElementById("rails").innerHTML = `
        <div class="rail"><span class="rail-label">Bottle</span><div class="chips">${railChips("names", "name")}</div></div>
        <div class="rail"><span class="rail-label">Base</span><div class="chips">${railChips("bases", "base")}</div></div>
        <div class="rail"><span class="rail-label">Finish</span><div class="chips">${railChips("finishes", "finish")}</div></div>`;
      document.getElementById("active").innerHTML = [
        ...f.locs.map((v) => `<button type="button" class="chip" data-rm="locs" data-v="${esc(v)}">${esc((Core.loc(v) || {}).name || "?")} ×</button>`),
        ...f.spots.map((v) => { const [l, s] = v.split("|"); return `<button type="button" class="chip" data-rm="spots" data-v="${esc(v)}">${esc(Core.placeName(l, s))} ×</button>`; }),
        f.barrel ? `<button type="button" class="chip" data-rm="barrel">Barrel ${esc(f.barrel)} ×</button>` : "",
      ].join("");
      document.getElementById("map").innerHTML = mapHtml();
      const S = Core.state();
      const res = Core.filterBottles(f);
      const units = res.reduce((n, r) => n + r.total, 0);
      const any = Core.filterActive(f);
      document.getElementById("resLine").innerHTML = `<span><b>${plural(res.length, "bottle")}</b>, ${units} on hand</span>${any ? `<button type="button" class="link" data-clear-all>Clear all</button>` : ""}`;
      const box = document.getElementById("results");
      if (!S.bottles.length) box.innerHTML = `<div class="empty">No bottles yet.<br><button type="button" class="btn primary" data-first>Add your first bottle</button></div>`;
      else if (!res.length) box.innerHTML = `<div class="empty">Nothing matches. Try fewer filters, or scan the barcode.</div>`;
      else box.innerHTML = res.map((r) => UI.bottleCard(r)).join("");
      header("Bottles", { sum: true });
    }
    function draw() { document.getElementById("banner").innerHTML = UI.backupBannerHtml(); renderRest(); }
    unmount = Core.on(draw);
    draw();
  }

  /* Spot sheet: what's on one shelf (or a whole room when spotId is null) */
  function openSpot(locId, spotId) {
    const filtered = Core.filterActive(f);
    let onlyMatches = filtered;
    const sh = UI.sheet({ title: spotId === null ? (Core.loc(locId) || {}).name : Core.placeName(locId, spotId) });
    function render() {
      const l = Core.loc(locId); if (!l) { sh.close(); return; }
      const allRows = Core.rowsAt(locId, spotId === null ? undefined : spotId);
      const allowed = onlyMatches ? new Set(Core.filterBottles(f).map((r) => r.b.id)) : null;
      const rows = allRows.filter((r) => !allowed || allowed.has(r.bottleId))
        .sort((a, b) => Core.bottle(a.bottleId).name.localeCompare(Core.bottle(b.bottleId).name) || Core.finishText(Core.bottle(a.bottleId)).localeCompare(Core.finishText(Core.bottle(b.bottleId))));
      const n = rows.reduce((m, r) => m + r.count, 0), nAll = allRows.reduce((m, r) => m + r.count, 0);
      sh.body.innerHTML = `<div class="spot-tools"><span>${onlyMatches ? `${n} matching of ${nAll} here` : `${nAll} bottles here`}</span>
          ${filtered ? `<button type="button" class="link" data-toggle>${onlyMatches ? "Show everything here" : "Show only matches"}</button>` : ""}</div>
        ${rows.length ? `<ul class="srows">${rows.map((r) => { const b = Core.bottle(r.bottleId); return `<li class="srow" role="button" tabindex="0" data-open="${b.id}">
          <div><div class="nm">${esc(b.name)}</div><div class="fin${b.finish ? "" : " none"}">${esc(b.finish ? b.finish + " finish" : "No finish")}${b.finishMonths !== "" && b.finishMonths != null && b.finish ? `, ${esc(b.finishMonths)} months` : ""}</div><div class="sub">${esc([b.base, b.barrel ? "Barrel " + b.barrel : "", spotId === null && r.spotId ? Core.spot(locId, r.spotId).name : ""].filter(Boolean).join(", "))}</div></div><span class="ct">${r.count}</span></li>`; }).join("")}</ul>`
          : `<p class="muted">${onlyMatches ? "Nothing here matches." : "Empty."}</p>`}
        <div class="actions"><button type="button" class="btn" data-count>Count ${spotId === null ? "this location" : "this spot"}</button><button type="button" class="btn primary" data-add>${ICON.plus} Add here</button></div>`;
    }
    sh.body.addEventListener("click", (e) => {
      if (e.target.closest("[data-toggle]")) { onlyMatches = !onlyMatches; return render(); }
      if (e.target.closest("[data-count]")) { sh.close(); return UI.openCountCheck({ locId, spotId, start: true }); }
      if (e.target.closest("[data-add]")) return UI.openBottleForm({ place: { locId, spotId: spotId || "" } });
    });
    const off = Core.on(render); sh.onClose(off);
    render();
  }

  /* ================= Count ================= */
  function mountCount(host) {
    header("Count check");
    const draw = () => {
      const S = Core.state();
      host.innerHTML = `<p class="page-sub">Pick a location or one spot. Confirm each bottle the app expects there, then fix anything that's off.</p>
        ${S.locations.map((l) => `<div class="count-loc">
          <div class="count-loc-h"><b>${esc(l.name)}</b><button type="button" class="btn small" data-cl="${l.id}">Count all ${Core.totalAt(l.id)}</button></div>
          ${l.spots.length ? `<div class="chips">${l.spots.map((s) => `<button type="button" class="chip" data-cl="${l.id}" data-cs="${s.id}">${esc(s.name)} <small>${Core.totalAt(l.id, s.id)}</small></button>`).join("")}</div>` : `<p class="muted" style="margin:8px 0 0;font-size:14px">No spots yet.</p>`}
        </div>`).join("")}`;
    };
    host.addEventListener("click", (e) => {
      const b = e.target.closest("[data-cl]"); if (!b) return;
      UI.openCountCheck({ locId: b.dataset.cl, spotId: b.dataset.cs === undefined ? null : b.dataset.cs, start: true });
    });
    unmount = Core.on(draw);
    draw();
  }

  /* ================= Settings ================= */
  const SET_TITLES = { menu: "Settings", places: "Locations and spots", types: "Types", bases: "Bases", finishes: "Finishes", excel: "Excel" };
  function mountSettings(host) {
    header(SET_TITLES[setPage], { back: setPage !== "menu" });
    ({ menu: settingsMenu, places: placesPage, types: (h) => listPage(h, "types"), bases: (h) => listPage(h, "bases"), finishes: (h) => listPage(h, "finishes"), excel: excelPage })[setPage](host);
  }
  function openSet(page) { setPage = page; go("settings"); }

  function settingsMenu(host) {
    const draw = () => {
      const S = Core.state();
      const spots = S.locations.reduce((n, l) => n + l.spots.length, 0);
      const bs = Core.backupStatus();
      const row = (page, title, sub, cls = "") => `<li><button type="button" class="menu-row ${cls}" data-page="${page}"><span class="mt"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</span>${CHEV}</button></li>`;
      host.innerHTML = `${UI.backupBannerHtml()}
        <ul class="menu">
          ${row("places", "Locations and spots", `${plural(S.locations.length, "location")}, ${plural(spots, "spot")}`)}
          ${row("bases", "Bases", `${plural((S.bases || []).length, "base")}, what each is made from`)}
          ${row("finishes", "Finishes", plural(S.finishes.length, "finish", "finishes"))}
        </ul>
        <ul class="menu">
          ${row("excel", "Excel import and export", bs.never ? "Never exported" : `Last export ${bs.days === 0 ? "today" : plural(bs.days, "day") + " ago"}`)}
        </ul>
        <ul class="menu">
          ${S.demo ? `<li><button type="button" class="menu-row" data-act="sample"><span class="mt"><b>Clear sample bottles</b><span>Keeps your locations, removes the made-up bottles and spots</span></span></button></li>` : ""}
          <li><button type="button" class="menu-row danger" data-act="erase"><span class="mt"><b>Erase everything</b><span>Every bottle, location, spot and history entry</span></span></button></li>
        </ul>
        <p class="menu-note">Your inventory is saved only on this phone. Export to Excel regularly as a backup.</p>`;
    };
    host.addEventListener("click", (e) => {
      const p = e.target.closest("[data-page]"); if (p) return openSet(p.dataset.page);
      const a = e.target.closest("[data-act]"); if (!a) return;
      if (a.dataset.act === "sample") UI.confirmSheet({ title: "Clear sample bottles?", text: "All sample bottles, spots and counts will be removed. Your location names stay.", ok: "Clear them", danger: true, onOk: () => { Core.clearSample(); UI.toast("Sample bottles cleared"); } });
      if (a.dataset.act === "erase") UI.confirmSheet({ title: "Erase everything?", text: "This removes every bottle, count, location, spot and history entry on this phone. It can't be undone.", ok: "Erase everything", danger: true, onOk: () => { Core.eraseAll(); UI.toast("Everything erased"); } });
    });
    unmount = Core.on(draw);
    draw();
  }

  function placesPage(host) {
    let editing = null; // "loc:<id>" | "spot:<locId>:<spotId>"
    const draw = () => {
      const S = Core.state();
      host.innerHTML = `<p class="page-sub">Changes show up on the map right away. Removing a spot keeps its bottles in the same location, under "No spot".</p>
        ${S.locations.map((l, li) => `<section class="place-card">
          <div class="pc-h">
            ${editing === "loc:" + l.id
              ? `<form class="inline-edit" data-form="ren-loc" data-loc="${l.id}"><input value="${esc(l.name)}" aria-label="Location name" /><button class="btn small primary">Save</button></form>`
              : `<span class="nm">${esc(l.name)}</span><span class="ct">${Core.totalAt(l.id)} bottles</span>
                 <span class="ord"><button type="button" class="icon-btn" data-a="loc-up" data-loc="${l.id}" aria-label="Move ${esc(l.name)} up" ${li === 0 ? "disabled" : ""}>↑</button><button type="button" class="icon-btn" data-a="loc-down" data-loc="${l.id}" aria-label="Move ${esc(l.name)} down" ${li === S.locations.length - 1 ? "disabled" : ""}>↓</button></span>`}
          </div>
          <ul class="pc-spots">${l.spots.map((s, si) => `<li class="pc-spot">
            ${editing === `spot:${l.id}:${s.id}`
              ? `<form class="inline-edit" data-form="ren-spot" data-loc="${l.id}" data-spot="${s.id}"><input value="${esc(s.name)}" aria-label="Spot name" /><button class="btn small primary">Save</button></form>`
              : `<span class="nm">${esc(s.name)} <span class="ct">${Core.totalAt(l.id, s.id)}</span></span>
                 <span class="ord">
                   <button type="button" class="icon-btn" data-a="ren-spot" data-loc="${l.id}" data-spot="${s.id}" aria-label="Rename ${esc(s.name)}">${PENCIL}</button>
                   <button type="button" class="icon-btn" data-a="spot-up" data-loc="${l.id}" data-spot="${s.id}" aria-label="Move ${esc(s.name)} up" ${si === 0 ? "disabled" : ""}>↑</button>
                   <button type="button" class="icon-btn" data-a="spot-down" data-loc="${l.id}" data-spot="${s.id}" aria-label="Move ${esc(s.name)} down" ${si === l.spots.length - 1 ? "disabled" : ""}>↓</button>
                   <button type="button" class="icon-btn rm" data-a="rm-spot" data-loc="${l.id}" data-spot="${s.id}" aria-label="Remove ${esc(s.name)}">×</button></span>`}
          </li>`).join("")}</ul>
          <form class="add-line" data-form="add-spot" data-loc="${l.id}"><input placeholder="New spot in ${esc(l.name)}, e.g. Cabinet 3" aria-label="New spot in ${esc(l.name)}" /><button class="btn small">Add spot</button></form>
          <div class="pc-foot"><button type="button" class="link" data-a="ren-loc" data-loc="${l.id}">Rename ${esc(l.name)}</button><button type="button" class="link danger" data-a="rm-loc" data-loc="${l.id}">Remove location</button></div>
        </section>`).join("")}
        <section class="add-place"><h3>Add a location</h3><p class="muted" style="margin:0 0 8px;font-size:14px">For a new storage area in the building.</p>
          <form class="add-line" data-form="add-loc"><input placeholder="e.g. Back storage" aria-label="New location name" /><button class="btn small primary">Add location</button></form></section>`;
      const inp = host.querySelector(".inline-edit input"); if (inp) { inp.focus(); inp.select(); }
    };
    host.addEventListener("click", (e) => {
      const t = e.target.closest("[data-a]"); if (!t) return;
      const a = t.dataset.a, lid = t.dataset.loc, sid = t.dataset.spot;
      if (a === "loc-up" || a === "loc-down") Core.moveLocation(lid, a === "loc-up" ? -1 : 1);
      if (a === "spot-up" || a === "spot-down") Core.moveSpot(lid, sid, a === "spot-up" ? -1 : 1);
      if (a === "ren-loc") { editing = "loc:" + lid; draw(); }
      if (a === "ren-spot") { editing = `spot:${lid}:${sid}`; draw(); }
      if (a === "rm-spot") {
        const n = Core.totalAt(lid, sid);
        const doIt = () => { Core.removeSpot(lid, sid); UI.toast("Spot removed", { undo: true }); };
        if (n) UI.confirmSheet({ title: "Remove this spot?", text: `${Core.placeName(lid, sid)} has ${plural(n, "bottle")}. They'll stay in ${Core.loc(lid).name} under "No spot".`, ok: "Remove spot", danger: true, onOk: doIt });
        else doIt();
      }
      if (a === "rm-loc") {
        const l = Core.loc(lid);
        if (Core.totalAt(lid) > 0) return UI.toast(`Move the ${Core.totalAt(lid)} bottles out of ${l.name} first`);
        UI.confirmSheet({ title: `Remove ${l.name}?`, text: `${l.name} and its ${plural(l.spots.length, "spot")} will be removed.`, ok: "Remove location", danger: true, onOk: () => { Core.removeLocation(lid); UI.toast("Location removed", { undo: true }); } });
      }
    });
    host.addEventListener("submit", (e) => {
      const fm = e.target.closest("[data-form]"); if (!fm) return; e.preventDefault();
      const v = fm.querySelector("input").value.trim(); const k = fm.dataset.form;
      if (k === "ren-loc") { editing = null; if (v) Core.renameLocation(fm.dataset.loc, v); draw(); return; }
      if (k === "ren-spot") { editing = null; if (v) Core.renameSpot(fm.dataset.loc, fm.dataset.spot, v); draw(); return; }
      if (!v) return;
      let r;
      if (k === "add-spot") r = Core.addSpot(fm.dataset.loc, v);
      if (k === "add-loc") r = Core.addLocation(v);
      if (r === "exists") UI.toast("That name is already used there");
      else UI.toast(k === "add-loc" ? `Added ${v}` : `Added ${v} to ${Core.loc(fm.dataset.loc).name}`, { undo: true });
    });
    unmount = Core.on(draw);
    draw();
  }

  function listPage(host, key) {
    const noun = key === "types" ? "type" : key === "bases" ? "base" : "finish";
    let q = "";
    host.innerHTML = `<p class="page-sub">These are the choices offered when you add or edit a bottle. Removing one here doesn't change any bottles.</p>
      <form class="add-line" data-form="add"><input placeholder="Add a ${noun}" aria-label="Add a ${noun}" /><button class="btn small primary">Add</button></form>
      <div class="search-box" style="margin-top:12px"><input type="search" placeholder="Find a ${noun}" aria-label="Find a ${noun}" /></div>
      <div id="listBody"></div>`;
    const body = host.querySelector("#listBody");
    const draw = () => {
      const S = Core.state(); const use = Core.usage(noun); if (!S[key]) S[key] = [];
      const n = Core.norm(q);
      const vals = [...S[key]].sort((a, b) => a.localeCompare(b)).filter((v) => !n || Core.norm(v).includes(n));
      body.innerHTML = `<p class="muted" style="font-size:13.5px;margin:0">${vals.length} of ${S[key].length}</p>
        <ul class="list-rows">${vals.slice(0, 400).map((v) => { const c = Math.floor(use.get(v) || 0); return `<li class="list-row"><span class="nm">${esc(v)}</span><span class="ct">${c ? plural(c, "bottle") : ""}</span><button type="button" data-rm="${esc(v)}" aria-label="Remove ${esc(v)}">×</button></li>`; }).join("")}</ul>`;
    };
    host.querySelector('input[type="search"]').addEventListener("input", (e) => { q = e.target.value; draw(); });
    host.addEventListener("click", (e) => { const r = e.target.closest("[data-rm]"); if (r) { Core.removeListItem(key, r.dataset.rm); UI.toast(`Removed ${r.dataset.rm}`, { undo: true }); } });
    host.addEventListener("submit", (e) => {
      e.preventDefault(); const inp = e.target.querySelector("input"); const v = inp.value.trim(); if (!v) return;
      if (Core.addListItem(key, v) === "exists") UI.toast("That's already on the list"); else { inp.value = ""; UI.toast(`Added ${v}`, { undo: true }); }
    });
    unmount = Core.on(draw);
    draw();
  }

  function excelPage(host) {
    const draw = () => {
      const bs = Core.backupStatus();
      host.innerHTML = `${UI.backupBannerHtml()}
        <section class="set-section"><h3>Export</h3><p>${bs.never ? "Never exported." : `Last export ${bs.days === 0 ? "today" : plural(bs.days, "day") + " ago"}.`} Saves every bottle with its location, spot and count as an Excel file.</p>
          <button type="button" class="btn primary wide" data-x="export">Export to Excel</button></section>
        <section class="set-section"><h3>Import and merge</h3><p>Counts in the sheet are added to matching bottles: same name, finish, finish time, barrel and ABV, in the same spot. 2 on hand + 4 in the sheet = 6. New locations and spots in the sheet are created for you. You'll see a short preview before anything changes.</p>
          <button type="button" class="btn wide" data-x="import">Import an Excel sheet</button>
          <p style="margin:12px 0 0;font-size:13.5px">Don't re-import a file you exported from this app. Its counts would be added again.</p></section>`;
    };
    host.addEventListener("click", (e) => { const x = e.target.closest("[data-x]"); if (!x) return; if (x.dataset.x === "export") UI.doExport(); else UI.startImport(); });
    unmount = Core.on(draw);
    draw();
  }

  go("find");
  UI.registerSW();
})();
</script>
</body>
</html>
